        "description": "NOW SUPPORTS BRITAS, GUNS OF 93, VANILLA, FIREARMS B41 REVAMPED and VANILLA FIREARMS EXPANSION.Handlebar’s Preppers aims to add a more interesting zombies that fill the “Prepper Role”. Unlike the Survivor zombies you find alongside roads in hordes, preppers will be dispersed among regular groups of zombies. These zombies will be noticeably more geared than survivalist zombies, as well as toting extra useful loot within their bags.This mod utilizes Vanilla Firearms Expansion, Britas, Guns of 93 and Vanilla weapons, giving you another way to loot weapons, and find rare weapons that may not spawn in crates and so on.Mod is mid game safe, to addon and remove.Please tell me your thoughts on balance. To many prepper zeds? Loot unbalanced? Please let me know!FAQDoes this work with Vanilla, Britas, Guns of 93, Firearms B41 Revamped & Vanilla Firearms ExpansionYes, yes it does.Can I add/remove this mod midgame?Yes, of course, though you have to find a new chunk that hasn’t been loaded before these zeds will spawn, or if you have zed respawn on, they should back populate?Can I configure this mod?You have to pick which weapon pack you are using, and you can adjust the frequency of prepper zed spawns.Can I use this without weapon mods, just Vanilla weaponsYes, there is an option for that!Which Option # is which Pack?Vanilla (1), VFE (2), Britas (3), Guns of 93(4), Firearms B41 Revamped (5)----------------------------------------------------------------------Server settings.At the bottom of your servers (yourservername)_SandboxVars, if not there, add    HNDLBR = {        -- Minimum=0.01 Maximum=5.00 Default=0.15        PrepperChance = 0.15,        PrepperWeaponPack = 1,        DoomsdayPrepper = true,    },The Prepper Weaponpack # correlates to one of these.\tSandbox_HNDLBR_PrepperWeaponPack_option1 = \"Vanilla\"\tSandbox_HNDLBR_PrepperWeaponPack_option2 = \"Vanilla Firearms Expansion\"\tSandbox_HNDLBR_PrepperWeaponPack_option3 = \"Britas\"\tSandbox_HNDLBR ch modpack with the elements from this mod inside will be taken down.\n\n[theindiestone.com]\nWorkshop ID: 3470422050Mod ID: KATTAJ1_ClothesCore",

    {
        "id": "2667899942",
        "url": "https://steamcommunity.com/sharedfiles/filedetails/?id=2667899942",
        "mod_id": "VFExpansion1",
        "map_folder": "",
        "title": "[VFE] VANILLA FIREARMS EXPANSION (B41)",
        "description": "This upload will no longer be updated (I literally can't) but a B42 branch will happen when it's ready. I will keep this mod up for both B41 users and as a memorial. - VilespringThis mod replaces the models, textures and names of nearly all vanilla firearms, attachments, ammunition and magazines. It also adds several new lore-friendly weapons and items.⚠️ READ THE FAQ ⚠️As of this version, 23 new firearms (and their magazines), 6 attachments, and two new calibers of ammunition.New WeaponsSPAS-12 Shotgun - Rare semi-automatic shotgun with a folding stock and 7+1 magazine tube.M590 Shotgun - Uncommon pump-action shotgun with a 7+1 magazine tube.R1187 Shotgun - Uncommon semi-automatic shotgun with a 4+1 or 7+1 magazine tube.MP5 Submachinegun - Rare select fire submachinegun using 30 round detachable magazines. Has a variant with folding stock and a built in flashlight.MP5SD Submachinegun - Very rare suppressed select fire submachinegun using 30 round detachable magazines.M10 Submachinegun - Very rare select fire machinegun using 32 round detachable magazinesUzi Submachinegun - Very rare select fire machinegun using 32 round detachable magazinesMini-14 Rifle - Uncommon semi-automatic rifle with 20 round detachable magazines. Has a folding stock variant.W1866 Carbine - Common lever-action rifle with internal magazine of 8+1 rounds of .38 Special.R92-44 Carbine - Common lever-action rifle with internal magazine of 8+1 rounds of .44 Magnum.M2400 Combination Gun - Common break action rifle/shotgun. Chambered in .308 and Shotgun Shells.AK-47 Assault Rifle - Very rare select fire assault rifle with 30 round detachable magazines. Has a folding stock variant.MAK-90 Rifle - Uncommon semi-automatic rifle with 30 round detachable magazines. Basically a more common version of the AK-47.FAL Battle Rifle - Very rare select fire rifle with 20 round detachable magazines.CAR15 Assault Rifle - Very rare select fire assault rifle with 30 round detachable magazines.TEC-9 Pistol - Uncommon semi-automatic pistol using 20 round detachable magazines.G17 Pistol - Uncommon semi-automatic pistol using 17 round detachable magazines.P229 Pistol - Uncommon semi-automatic pistol using 13 round detachable magazines.CZ 75 Pistol - Uncommon semi-automatic pistol using 16 round detachable magazines.Mk2 Pistol - Common semi-automatic pistol using 10 round detachable magazines. Has a rare integrally suppressed variant.SKS Rifle - Uncommon semi-automatic rifle with 9+1 internal magazine. Has a variant with a built in bayonet.R1022 Rifle - Common semi-automatic rifle using 10 round detachable magazines.MC-45 Carbine - Common semi-automatic rifle using 7 round detachable magazines.M24 Sniper Rifle - Very rare bolt-action rifle using a 5+1 internal magazine.M60 Machinegun - Extremely rare automatic belt fed machinegun using 100 round belts. Requires ammunition with links and will drop the links while shooting.M16 Masterkey Assault Rifle - Extremely rare select fire assault rifle with 30 round detachable magazines. Features an underbarrel shortened M590 shotgun with an internal tube magazine of 3 + 1.M9 Bayonet - Uncommon knife. Can be mounted onto an M16 or M590 for use as a bayonet.Entrenching Tool - Uncommon tool. Can be folded and used as either long blunt or an axe.New Ammunition7.62 Ammunition - Used in AK47 and SKS Rifles..22 Ammunition - Used in R1022 rifle and Mk2 pistols.Linked .308 Ammunition - .308 with the M13 Ammunition Link. Used in the M60 Machinegun.New AttachmentsBipod - Stabilizing bipod that can be attached to SKS, M14, R700, R788, and M24.Shell Holder - Side mounted shotgun shell carrier to speed up shotgun reloads.Shell Straps - Statistically the same as Shell Holder, but mounts on some weapons the Shell Holder cannot.Lightened Stock - Statistically the same as the Fiberglass Stock but without the cosmetic changes.Coupled magazines - Craftable taped assault rifle magazines to speed up reloads. (5.56 and 7.62)Brass Catcher -  Cratable attachment for the M60 Machinegun that keeps links from dropping onto the ground.This mod also rebalances weapon attachments in a manner that makes more sense compared to the vanilla game. (For example, you cannot mount a red dot sight on most handguns, excluding the DE Pistol, and the Magnum Revolver.)Reworks to JammingIn vanilla when a weapon jams it consumes a round when it is unjammed. With VFE the round is returned if the gun is completely unloaded before clearing.Jamming probability curve has been completely rewritten. In vanilla a 90% M16 only has a 50% chance of getting through a magazine without jamming. Now guns only begin to jam at 75% or 70%. They also start to jam more than vanilla guns do at 25% or 20%. Basically high condition guns jam less (or not at all) and low condition guns jam more often.Manually cycled guns can jam now. Pump shotguns and bolt action rifles do their jam calculations when a round is chambered.ZombiesMany more zombies in the world can spawn with firearms on them. Survivor zombies have also been given a bit touch up.Sandbox OptionsQuite a few aspects of the mod is configurable via sandbox settings. This is mostly toggles as to where VFE puts its guns, but also contains a multiplier for weapons in normal houses. An option exists to disable spawning of the M60 Machinegun, if such is desired.This version of the mod is not final, we will continuously update adding new things and changing old ones.FAQQ: Is this mod compatible with Brita's/Arsenal26?A: No. They are incompatible at the lua level. VFE is also designed around its own balance design, so using both at the same time doesn't make sense.Q: I took an attachment off a weapon and it won't go back on.A: You have a soft mod incompatibility. Another mod is overwriting attachments.Q: A weapon doesn't accept an attachment that makes senseA: Usually same story as previous question, but there is a chance it was missed. If its still true with just VFE in the modlist, report it. Also make sure you have a screwdriver in your inventory.Q: Can this mod be installed mid save?A: Yes and no. The new guns will spawn in unexplored locations, but guns already spawned will still retain their old stats, like damage and range. If you do decide to add it to an existing save you will have to delete and respawn all the guns you already have. The same is true with uninstalling. (when it comes to weapon stats)Q: Does this mod have suppressors?A: No. They're not off the table but they are also not a priority.Q: Why are some guns invisible?A: Maxwell's suppressor mod causes this when that mod is out of date. That is a problem with that mod, not VFE itself.Q: Why are some guns tiger striped/rusted/wrong textures?A: Issue with the texture optimization mod. Basically VFE changes textures for its models, but the texture optimization mod reverts them to vanilla.Final NotesIf you find any bugs, dislike something, or just have ideas you'd like to see incorporated into this mod, please let us know in the comments!CREDITSStendo_Clip - Models, Textures, Scripts, LuaSpuchel - Textures, Icons, Scripts, Lua, AnimationsVilespring - Models, Textures, Scripts, LuaSpecial thanks to TedEBear of Serious Survival Roleplay for sponsoring the M60 and several other firearms.Special thanks to Alec for letting us use his magazine models from his mod, Ammo & Magazine icon MOD.Special thanks to Great Hero J for creating various pixel art sprites that VFE uses as item/interface icons.Workshop ID: 2667899942Mod ID: VFExpansion1",

        "title": "Shops",
        "description": "Hello survivors, are you tired of using the crafting window as a shopping system?Because I was ...So I coded a Shopping UI for  Valhalla Community[discord.com]But is not just a simple UI its has a lot of features that you are going to love (or maybe not)Currency Loot Coin/Money Script = loot all the coins/money available in all nearby containers (\"Loot All Coins\" option in context menu when you right click on coin/money item) Wallet has 4 context menu options \"Link\", \"Unlink\", \"Transfer\" and \"Move Coins to Account\" Wallet needs to be Linked to your character, use right click on the wallet, you can only have 1 wallet linked, the others ones will be invalid You can Unlink wallets to let other people use them. Your money will stay in your account. Wallet will display your balance in the tooltip and its used to deposit money in your account Right click on coins/money to put them in your wallet (wallet needs to be in main inventory) Your wallet doesn't store your coins/money, coins/money are stored in your account when you use the option \"Move Coins to Account\" If you die your money is safe Transfer option, it will display a UI for coins transfersTransfer Transfer UI Search for another survivor in the search input and transfer them money The user that receives the money will get a notification with the transfer information (only when he's in game at the same moment that the transfer was made) Shops Shopping UI no more crafting windows There's 2 context menu options when you left click on the world    1) Shop: this option shows up when you left click on the shop tile    2) View Shop items: this option is available from everywhere is used to view the shop items (not to buy) Support 2 types of currency \"normal\" and \"special\" (for event type stuff) Tabs for item categorization Search for items and put them as Favorite is you don't have enough money to buy them Sell items that are in your character inventory (using the Sell Tab) Support for \"Pack Items\" (item that can contain more items inside) 3D Car model viewer, ( CarWanna pinkslip support only, or write your custom patch lol) Shop tiles with fake NPC's (4 variations with a \"For Sale\" sign) that can be set up by an Admin to use the Shop Shop tiles can be rotated in 2 positions (Use your building rotation key, default is \"R\" if you didn't change it before) Shop tiles is indestructible, only admin can remove/sledghammer it You can only buy stuff with your account money, there's no need to have a wallet on you to buy stuff You can view the shop from anywhere but only purchase items at the shop kiosk Right click the new kiosk and click on \"shop\" to open shopping window Player Shops Players can build their own shop ( Crafting window in Carpentry tab ) Place your Player Shop using the context menu by clicking in the world (not the player shop item) then use \"Add Player Shop\" option Player Shop tiles can be rotated in 2 positions (Use your building rotation key, default is \"R\" if you didn't change it before) Set prices to your items: you need to have an item that has the tag \"Write\" (items that let you write on map,journal ...) and the item that you want to sell in your inventory  right click on the item that you want to sell use option \"Set Price\" a UI to set price will show up (if you are using 2 types of currencies the highest price in the UI will be the selling price of the item) Player Shop is a 100 unit container (yes is affected by traits like Organized or Disorganized) Only the player shop owner can remove items from the player shop container. Player Shop has one context menu option \"Manage Shop\" with 5 sub menu options:      1) \"Lock shop container\" locks shop container to avoid another seeing the containers items      2) \"Unlock shop container\" unlocks shop container       3) \"View Income\" displays a UI with your shop transactions (Buyer name and total payment), Get button will sent           your income to your linked account      4) \"Pick up player shop\" pick ups the player shop if there's not items or income left in your shop      5) \"Change Sign\" change your shop sign theres 10 options available Your selling items needs to be transferred to the Player Shop container and they need to have a price set to show up in the Player Shop UI (dont forget to lock your shop container) Player Shop can be used only by one player at the time, you will have to wait until the other player leaves the shop to use it Player Shop has a 10 min protection lock when a player is viewing a player shop and it has a CTD or another type of disasters Player Shop is indestructible, only admin can remove/sledghammer itITS COMPATIBLE WITH X,Y or Z MOD? No, write a patch :)HOW TO WRITE A PATCH?Take a look a the mod  ShopsX, the code has more info on how to do it with examples, YOU NEED TO READ THE COMMENTS IN THE CODEWorkshop ID: 2840330802Mod ID: nshops",

        "map_folder": "",
        "title": "Toe Tags",
        "description": "When your character dies, a Toe Tag is automatically generated and placed in their inventory.  If you read the toe tag it contains relevant information such as the date you died, the time you survived as well as your favorite weapon and kill count.The primary purpose here is to make it easier to identify your former characters from a pile of corpses. In multiplayer is also allows you to determine who the corpse belonged to.  For single player the \"Username\" field in the toe tag details will seem pretty redundant.  However in multiplayer this will show the Steam Username of the account that was in control of this dead character.It is 100% safe to add or remove from existing worlds.Fully multiplayer compatible, 3d modeled and placeable in-world.Tags have 0 weight to avoid conflicts adding them to inventories on death.Toe Tag Details  Field Purpose Example   Toe Tag Title The Character Name Ted Fisher   Username The account in control of this player Orc   Profession The Character's starter profession Engineer   Died The game timestamp of your death Fri Jul 9 11:14:19 EDT 1993   Favorite Weapon The 1 weapon you got the most kills with Baseball Bat   Survived For The number of months/days/hours you survived for 1 day, 2 hours   Zombies Killed Total zombie kills you achieved 19   Infection status Did you have the knox virus when you died? Not infected Optional: Mod OptionsAll the details recorded on your Toe Tag can be toggled on or off to suit your needs if you have \"ModOptions\" installed. When detected you will see a new \"Toe Tag Options\" category with a series of toggles so you can adjust the toe tag information to suit your own needs and preferences.  Without it the mod defaults to recording everything except for traits.Regarding \"ToeTagsSorted\" Sub-ModDO NOT ENABLE THIS.  This sub-mod is from before the ModOptions changes were made to the source mod.  It is merely included to ensure that no servers who were using the mod at the time were accidentally disabled.  It has a built in dependency that can not be met to stop people from using it.YOU DO NOT NEED \"ToeTagsSorted\"TranslationsToe Tags currently supports English and Thai.  You can contribute translations in this thread.   Translation updates will be published on Tuesdays.Known Issue with DatesFor some reason or another the watches in game always show the date is one day ahead of what the game engine says.  So for example, when you die, we ask the game engine what the date is.  It replies back with \"July 09\" for example.  As far as the simulation is concerned it is Fri Jul 09 at 11:14:19 EDT in 1993 BUT your watch in the user interface says \"July 10\".No matter how you go about querying the date (linux timestamps, flat text strings, start date + hours survived, etc) the engine always reports the same and the clock is always 1 day ahead.  I've come to the conclusion that the watch is actually incorrectly programmed.As such, your toe tags will appear to be 1 day behind the watch.  It's pretty minor as your Survived time is still accurate, it's just the date that is one day off on display.Toe Tags  is Open-Source and published on Github[github.com].Repackage, redistribute, recode, whatever, I don't care, do as you please.Credit would be appreciated. [ko-fi.com]Workshop ID: 2866203459Mod ID: ToeTagsMod ID: ToeTagsSorted",

        "title": "Pocket Kittens",
        "description": "Wake up, scavage for food, kill your neighbors, go to bed, cry.  Wake up, scavage for food, kill your family, go to bed, cry. Wake up... day after day after day. It's mundane, it's depressing and it's every so lonely until one day.... a little furball shows up on your door. He's hungry, he's desperate, he NEEDS YOU.  Life has a purpose, Mr Mittens needs you, he needs your food, your love and your attention.  Things don't seem quite as gloomy anymore.Pocket Kittens adds several different breeds of kitties for you to trap and give a \"furever home\" to.  They roam mostly in cities and trailer parks but can sometimes be found in the forest.  Set up traps with the appropriate bait and wait.  Eventually you'll find yourself a new friend. Once you do, take them home for cuddles or maybe put some effort into making a safe pocket for them to join you on your travels.Having a companion with you can help reduce your boredom and unhappiness in this gloomy world with death creeping around every corner.Pocket Kitten Breakdown  Adds several different kitten breeds   Black, Calico, Gray, Gray Striped, Orange, Tuxedo, White  Modeled and placeable in-world   Adopted kittens can be permanently renamed (right-click in inventory)  Adopted kittens can be placed into a pocket and worn as jewelry   When worn reduces boredom and unhappiness periodically  Useful for those long days spend boringly organizing your base  Reduction can be configured through sandbox settings   Kittens in Pockets can be attached to Authentic Z and Noir's Attachments backpacks   Utilizes the \"Plushie\" Slot with Authentic Z  Utilizes the \"Utility\" Slot with Noir's Attachments  Functions the same as wearing a kitten (reduce boredom/unhappiness)   Utilizes standard game trapping mechanics   Best to Worst:  Cage Trap, Box Trap, Crate Trap, Snare   Utilizes a variety of bait   Best to Worst: Open can of tuna, open can of milk, open can of sardines, fish fillet, dead bird, bait fish, dead mouse, and cat toys   Collect all the Kitties and earn yourself the \"I Love Kitties\" Achievement shirtSafe to add/remove mid-game.  Works in Single player and multiplayer Pocket Kitten IDsAll Kittens are in the \"PocketKitten\" module.  Therefore their IDs are prefixed with PocketKitten.For example KittenBlack is referenced as PocketKitten.KittenBlack   STRAY ID KITTEN ID POCKET ID   Black KittenBlack PetKittenBlack PocketKittenBlack   Calico KittenCalico PetKittenCalico PocketKittenCalico   Gray KittenGray PetKittenGray PocketKittenGray   Gray Striped KittenGrayStriped PetKittenGrayStriped PocketKittenGrayStriped   Orange KittenOrange PetKittenOrange PocketKittenOrange   Tuxedo KittenTuxedo PetKittenTuxedo PocketKittenTuxedo   White KittenWhite PetKittenWhite PocketKittenWhite   Zombie KittenZombie - - Sandbox VariablesWhen a Pocket Kitten is worn, it reduces loneliness by lowering boredom, unhappiness and stress values on an hourly basis.  You can adjust (or even disable) these values by manipulating the Sandbox Variables listed below.  Set this to suit your personal preferences or server's needs.  Setting Description Range Default   PocketKitten.ReduceBoredom Amount of boredom removed hourly  0 - 100 12   PocketKitten.ReduceUnhappiness Amount of unhappiness removed hourly  0 - 100 12   PocketKitten.ReduceStress Amount of stress removed hourly  0 - 100 5 Optional SubmodThough I really did not want to do this, there has been quite a bit of requests for it so I finally caved in and created \"Pocket Kittens (Psycho Recipes)\". This optional addon will allow you to slaughter stray kittens (and only strays) and harvest their meat.  The meat can be used in a variety of regular zomboid recipes (stirfry, rice, etc) and even used as bait to trap rats.You can not slaughter adopted animals because it ends up just being too over powered.  Adopted cats never become rotten or stale, so if you could harvest meat from them, you would find yourself an infinite source of perfect meat.   Therefore only Strays (who can be stale and rotten) can be harvested.If you don't like it, don't enable it.  I sure won't be.TranslationsPocket kittens currently supports English, Spanish, Simplified Chinese, Brazilian Portuguese, Japanese, Russian, Korean and Thai.  You can contribute additional translations herePocket Kittens is Open-Source and published on Github[github.com].Repackage, redistribute, recode, whatever, I don't care, do as you please.Credit would be appreciated. [ko-fi.com]Workshop ID: 2883925239Mod ID: PocketKittensMod ID: PocketKittensPsycho",

        "description": "You can find several types of traces of ores in the deep forest, while picking them up they will automatically convert from your bag to ground where you are standing and then while investigating further - turn them into randomised ore deposits. These deposits are heavy and can't be moved. Works both in SP and MP and can be added/removed mid-game.Details:You find traces of ores while foraging in DEEP FOREST. Need forage skill +5. They should be pretty rare to come by.When finding the traces it will be spawned on the ground infront of you(You have to take a small step to see it in the loot menu.)While having a pickaxe you can investigate the ore traces and it will turn them into one of 7 ore deposits - Rock, coal, iron, salt, aluminum, silver or gold.Rock is the most common while others come with declining frequency with gold and silver being quite rare.There are 3 different sizes of ore deposits - 5-10-20 actions per deposits. After that they will dissapear.Mining activity drains your endurance, thirst and hunger and gives fatigue. It can also give you minor injuries.The mined raw resources are mostly left to be the bottom vanilla items : such as stone, unusable metal and aluminum. With some like salt and coal- they come in a simple ore form that can be converted into table salt and charcoal respectively.My following mods have more recipes in them to turn some of the mined items into useful stuff:Real Metalworking - Handles IRON related items - including  Gold/Silver. The Engineer - Handles most of the ALUMINUM related items.Food Preservation Plus - SALT can be used in various recipes.Credits :To my mentor Glytch3r, to Dane who is always most helpful and to the whole PZ modding community for without you I wouldn't have learned half as much. Also to Melo for tuning up my rocks back in the day - I knew I can use them again somewhere!Russian translation - Thank you axelroadman This is part of... : Project Realistic Overhaul - Set of mods I've created that will overhaul the vanilla game experience to be more hardcore and true to life, but on the other hand leaves you the option to make it through and survive. It makes items and actions have more value and makes the world more alive.Workshop ID: 2963057869Mod ID: DynamicMining",

        "id": "3014820613",
        "url": "https://steamcommunity.com/sharedfiles/filedetails/?id=3014820613",
        "mod_id": "AutomaticGateMotors",
        "map_folder": "",
        "title": "Automatic Gate Motors",
        "description": "Automatic Gate MotorsAdds ways of remotely open and close gates that where built by a player.New Update! - Version 1.1.6To check out all the new features, take a look at the Changelog!If you have a server, be sure that BackupOnStart=true on server settings (or have a backup) to avoid issues!Features:Adds 3 new items: Automatic Gate Controller, Automatic Gate Motor and a new magazine: (see How to use it?) The Automatic Gate Motor can be crafted and installed on any gate that can be built by the player, turning it into a Automatic Gate.(Can't be installed on garage doors or gates that already exists and can't be build by the player) The Automatic Gate Controller can be connected to a Automatic Gate to interact with it. The new magazine is called \"All about Automatic Gates\" and enables the player to craft all the above mentioned items.Apart from new content, there also a few features to help with player interactions and enables the Mod to be more flexible There are feedbacks to the player in almost every action related to the Mod. The tooltips are very self-explanatory to help the player figure out things. The Mod is completely translate-able (See pinned discussion for Translations). A lot of things can be changed via the Sandbox Settings, including skill level requirements for crafting and other settings.How to use it? Find the magazine \"All about Automatic Gates\" to learn the recipes and how to install the motor. Craft a Automatic Gate Motor and a Automatic Gate Controller Install the Motor on a gate using a Propane Torch and Welding Rods (option only shows if you read the magazine and have a Propane Torch and a Welder Mask) You can connect the Controller to the Automatic Gate to use it To open/close, the gate needs any car battery inside it's new container (corner part) The gate can be locked/unlocked (automatically/manually) using a Controller (automation part can be changed via Sandbox Settings) The gate can be renamed. Controllers will have the current name of the gate, and will update automatically on change. The Controller have a maximum range to work (can be changed via Sandbox Settings) The Controller can be attached and used on the Belt (On a Gamepad, use the Left-DPad RadialMenu) You can Double-Click on the Controller to use itThis should be everything you need to know to use get around how to use the mod.If you want to know more and don't care about spoilers, I recommend you read the full List of Features[pastebin.com]BE CAREFUL!If the gate is locked, you cannot connect another controller directly to it.So, if you have no controllers connected to a gate, and it is locked, the only solution is to DESTROY the gate and build a new one.This is done for security reasons (MP). If you have a idea on how to do it better, see pinned discussion Suggestions.Questions:Is it compatible with Multiplayer?Yes! All the testing was done using the \"Host\" option, and all features are working without problems.Does it work on existing saves?Yes! It can be enabled mid-save without any problems.You will just need to explore new areas to get the Magazine, or (spoiler):Create a new survivor with the Engineer profession (already existing engineers will not know the recipes)(If you already have motors installed there may be problems with disabling)Does it work for all game versions?Only tested on current game version: 41.78.16What mods it is incompatible?Currently, the only incompatible mod know is Sensors and Traps.Translations: English Brazilian-Portuguese Russian (Thanks for 666rdsrds666) Korean (Thanks for BeDuck) Simplified Chinese (Thanks for Phoenix) Italian (Thanks for Astram) French (Thanks for Commander) Spanish (Thanks for Antonete2005) Polish (Thanks for Miki)Planned Features: Keybindings - Added on v1.1.0, with Belt attachment (Suggested by Astram) Renaming Gates - Added on v1.1.0, compatible with Rename Containers Master Controller Proximity sensorsFound any bugs?This is actually my first Lua mod, expect things to (sometimes) not work properly.If you encounter any errors or bugs, report them according to the first post in the pinned discussion Bug Reports.For any questions, please be kind and leave a comment below!Credits:The idea of making this mod came from this.My mod was made from scratch, but was that mod that got me all the inspiration to make my own, and credits should be given ;)I would also like to thank everyone in #mod_development on the official Project Zomboid Discord[discord.gg] (especially @albion =D)Don't forget to rate and favorite!PermissionsThis mod's permissions fall under TIS's policy Ask For Permission[theindiestone.com]\n[theindiestone.com]\nThis mod can only be added to and extended with the express permission from the original creator. Having received permission, credit must be given to the original creator, both within the files of the mod and wherever the mod roams online.\n\nIf no permission is received you may not alter the mod, and it must be treated as a mod that is 'On Lockdown'.If you like this mod, check out my other mods!    Workshop ID: 3014820613Mod ID: AutomaticGateMotors",

    {
        "id": "3042138819",
        "url": "https://steamcommunity.com/sharedfiles/filedetails/?id=3042138819",
        "mod_id": "FunctionalAppliances2",
        "map_folder": "",
        "title": "Functional Appliances 2",
        "description": "New Extractor Hoods in B42!Build them in a square where you place your generator to extract the fumes from it out of the building. All automatically, but the hood will not start until power is there and will not extract unless a running generator is under the hood in the same square.Popcorn Machines: They now have function and will convert instant popcorn packets and Sapph's corn kernels into edible popcorn without the pain of burning the food. Popcorn buckets are also added and you can butter the popcorn when in a bucket.Hotdog Machines: They also have function and will keep from burning those priceless sausages. It uses the base sausages and sliced bread in the game to make hotdogs. If you have Sapph's Cooking mod installed you can also use the sausages and hotdog buns from that mod as well.Soda Fountains: Are now plumbed objects and will dispense water for all the uses. It also dispenses soda to fountain cups and refills soda/water bottles for preserved use. They use soda syrups and CO2 tanks to operate. Just drop them into the counter the table top unit is on or put them inside the Slurp 'n Burp stand alone unit. These can now pull materials from any static container in the square or the square behind them. If water is a problem, try using water jugs from the Water Dispenser mod or plumb it like a sink.Bar Taps and Kegs: Setup the kegs in furniture containers with the taps connected and you can pour them into red cups, beer mugs, and refill bottles. Kegs pulled from any static container in the square with the bar taps. Compatible with More Brews and More Brews kegs now spawn in bar tap counters in 2.0!Food Display Counters, Buffet Islands, Rounded Glass Display Counters and Vending Machines: These are now temperature settable appliances for food storage. Some have Hot, Warm, or Cold others just Warm and Cold. Each segment has it's own settings. Now automatically spawn on when they can and switch to cold in ice cream parlors, cafes, bakeries, etc. Pizza parlors and other restaurants will default to warm. Soda Machines automatically default to cold.Industrial Deep Fryers: The deep fryers are now setup to randomly have vegetable oil in them. You can add and drain the oil. If you have power you can turn them on and fry various foods that usually need a pan of oil with Sapph's Cooking mod. A few new recipes have been added: Doughboys, Chicken Fillets, Chicken Tenders, Blooming Onions, and Fried Cheese Sticks. Added Sapph's Cooking Oil for a second option to fill the vats.Pay Phones: They have a minor interaction. If you touch them they might just ring but they'll attracted anyone that happens to be listening...Wall Clocks: They will now display the time. Clicking on them will give you the current time. Wall clocks work based on electrical availability, once off the grid they run off a built in battery that slowly drains. Power up a generator and they will recharge over time. If you are desperate, you can drop a new standard flashlight battery into them, but that's a one way trip. Clocks now show 12hr format and stop when dead. All times accurate to the minute when powered.Paper Towel and Napkin Dispensers: They show up as small containers and come standard with a few loose napkins. Napkins can now dry off players and wet napkins can wash off dirt and blood. In order to allow compatibility, the new ones drop in the dispensers. Vanilla game napkins have a conversion recipe to use them as well.Coffee X-Press and Espresso Machines: Turn on the machines and make coffee. Use mugs, teacups, and thermos or lowballs from Sapph's. Tea and instant coffee options exist in the vanilla game to make a quick fix. Add Sapph's to get coffee beans that can be ground in the espresso machine. Then you can brew coffee or espresso. Take the espresso and foam it up in the espresso machine with any \"Milk\" type item and turn it into a latte or cappuccino. Don't forget you need power and water. If the water is off, any source in inventory will be used for the coffee.Bulletin Boards: Both large and small corkboards, you can now add things into it's container and the random notices appear as overlays.Peg Boards: Containers that spawn with tools and have an overlay.Pool Cue Stands: Containers that spawn with pool cues and have an overlay.Green Oven Silo Generators: It has the same depletion of fuel as a standard generator and the same radius of power. It can be turned on/off manually and has an auto start feature. It can be used as a backup to other generators and sense when it's time to start. It can be repaired with electronic scrap or scrap metal but will need the generator skill, electrical 4, or mechanics 4. The standard generator manual can spawn with the machine. It has a 500 fuel unit capacity and can be filled or emptied while running. There is no need to connect these as they are stationary and already connected. If found indoors they are also vented to keep the toxins out. If they run out of fuel they will shutdown, if they run out of condition they make a loud *BOOM* that attracts zombies in the area. Now moveable in 2.0 thanks to the Green Oven Corporation! \"When your power is lean, buy Green!\" ***Fuel and Condition of generators zeros out when moving, empty first!***v2.07 Updated for B42 Not all aspects of the original Functional Appliances are available due to changes in the game.   Display cases, buffets, and vending machines still have temperature settings.   Peg boards still load tools.   Bulletin boards now have photos and fliers.   Napkins can be used to dry or wet them to wash yourself off in a pinch. Vanilla napkins can be converted to FA       versions.   Beer taps work with the kegs and pour into an empty vessel of choice.   Soda Fountains now have all the flavors available in the game, non-vanilla sodas will spawn with cans and bottles       too.   Popcorn machines use vanilla items to still make the popcorn.   Hotdogs can now be made with sausage or wieners and use the vanilla buns or bread slices. All can be cooked in       the machine.v2.08 hotfix   Corrected error with distribution in 42***On servers you may need to set anti-cheat 21 as false if it kicks players, it points to a file mismatch between player and server.***If you see any bugs let me know. I tried to make the functions and items as unique as possible to keep from any conflicts. A big thank you to everyone that has helped with identifying the bugs and Lazarus for his support and time fighting them on our server to try and make things right.Thank you and enjoy!My other mods:All New: True Music Radio! Powered by True Music media Now with multiplayer sync!https://steamcommunity.com/sharedfiles/filedetails/?id=3100475013The new multiplayer true music jukebox is now available!True Music Jukeboxhttps://steamcommunity.com/sharedfiles/filedetails/?id=3118990099Workshop ID: 3118990099Mod ID: TrueMusicJukeboxSuperGigaMart!https://steamcommunity.com/sharedfiles/filedetails/?id=2878074695Discord: https://discord.gg/9xNdeBr7Wz[ko-fi.com]Workshop ID: 3042138819Mod ID: FunctionalAppliances2",

        "id": "3431256608",
        "url": "https://steamcommunity.com/sharedfiles/filedetails/?id=3431256608",
        "mod_id": "GanydeBielovzki's Frockin Splendor! Vol.3",
        "map_folder": "",
        "title": "[B42] Frockin Splendor! Vol.3",
        "description": "Every piece of high quality, shiny black leather clothing you will ever need: bodysuits, leotards, tops & crop tops, boleros, shorts, skirts, leggings, pants, gloves, corsets, harnesses and stockings. Big ticket items include leather trench coats, cropped jackets and a selection of eight high heels and boots*. Certain clothing types have designer, novel and super variants. 95 different items, 736 variants in total. All can be found in containers at reasonable places, and worn by zombies. Use context menu options to adjust the appearance of the outfits: wear on different limbs, roll sleeves, zip up or down, wear with or without accessories, etc. This mod is the first of a multi-stage project to bring a certain B41 mod to B42. Make no mistake, this is not, and will not be a simple port. Everything has been revisited, remastered and expanded with new tech, functionality and depths (ha). You can expect the same level of improvement for the remaining parts when they come to B42.  ***OPTIONAL!*** Due to the introduction of a new tech in B42, \"depth mapping\", high heels will now appear to be clipping into the floor. To work around this issue, a modified depth map is included in the mod folder that is specifically fine tuned to resurface the heels while causing minimal disruption. This solution requires manual installation:  1. Navigate to your \"Project Zomboid\" installation and media folder (by default should be something like: \"C:\\Program Files (x86)\\Steam\\steamapps\\common\\ProjectZomboid\\media\"), and locate the \"depthmaps\" folder.2. In another window open the mod folder (by default should be: \"C:\\Program Files (x86)\\Steam\\steamapps\\workshop\\content\\108600\\3431256608\\mods\\Frockin Splendor! Vol.3\\42\\media\\\"), and locate the base game \"depthmaps\" folder. 3. Copy the \"depthmaps\" folder (which should contain a single png file named \"DEPTH_preset_depthmaps_01.png\") and paste it to the base game media folder, and overwrite the original \"DEPTH_preset_depthmaps_01.png\". With game updates it will be restored to default so you may need to repeat the installation process.  Q: Is this mod save compatible?  A: YES. Though the new items will not spawn in already discovered areas, zombies with Frockin Splendor! clothes should start spawning after installation.  Q: Where are the zombies wearing your clothes?  A: They are relatively rare to avoid crowding out the spawn table. Keep killing them and you'll run into one. Alternatively, make your way to a certain establishment in Louisville and you'll see plenty of them.  Q: I can't find the stuff in containers!  A: While the mod is save compatible, you will need to go to areas previously unexplored for the new items to start spawning in. A new tech has allowed this mod to place items in custom containers, or, \"gift boxes\", inside other containers such as wardrobes or crates. This way all Frockin Splendor! clothes can be found in reasonable quantities, while not crowding out the loot tables for vanilla and other modded items. These \"gift boxes\" have between 0.55% and 1.19% chance to spawn.  Q: Why didn't you port the crafting system to B42?  A: At the current stage B42 crafting is in a very unfinished state. There are placeholder codes and recipes and are clearly subject to change. It would be unwise to overhaul the old crafting recipes only to have to redo it when The Indie Stone inevitably changes things. Crafting will come later.  Q: Can I use your mod in my mod pack?  A: Ask for permission!  Q: Mod compatibility issues?  A: All Frockin Splendor! mods are guaranteed to be compatible with each other. There should be no conflicts with other mods, to the best of knowledge. Please report any error you encounter in the BUG REPORT post.  Q: What about character model mods?  A: A majority of the clothing items do not have a separate mesh, meaning that they can be used with various character model mods without issue. Some of the items that do have separate models may have minor clippings if you use a character model that deviats too much from the base game.Liking the mod? Give it a rating to show your support!Feel like having some nice dresses? We got you covered with the first volume of Frockin' Splendor!Fancy something more casual? Perhaps some sportswear? How about those 80s questionable workout outfits? Come visit us at Frockin' Splendor Volume 2!Want all the leather goodies in B41? Head over to Kink It Up! Extra.              Mods used in thumbnails and preview images:TTRP Poses by CrystalChrisSimple Character Retextures by heafoxyBoots Expanded by Mark IVand various hairstyle mods. All recommanded.Workshop ID: 3431256608Mod ID: GanydeBielovzki's Frockin Splendor! Vol.3",

        "description": "[patreon.com] It's time for true music in Project Zomboid again. The mod allows all users to add their music to the game. In addition, you can add your own vinyl covers.Features of the mod:item \"Boombox\" (powered by batteries)item \"Pocket player\" (powered by batteries)item \"Vinyl player\" (works only on electricity)all cars are equipped with a cassette playerplaying music lures zombiesHow to add your own music in SINGEPLAYER (only for Windows):Video tutorial: https://youtu.be/9DZghSBPOy4Go to \\workshop\\content\\108600\\2613146550\\mods\\True Music\\media\\yourMusic Extract the contents of yourMusic.rar or yourMusic.zip (before rename the file \"yourMusic.zi\" to \"yourMusic.zip\")  to the yourMusic folder.Place audio files in mp3, wav, ogg format in the TCBoombox and TCVinylplayer folders.(optional) Place vinyl cover photos in TCVinylplayer folder in jpg format. They should be named the same as the music track file. Each music file can have its own cover.For example, the file with the track is called \"AC DC - Highway To Hell (1979).mp3\", the file with the cover should be called \"AC DC - Highway To Hell (1979).jpg\".The easiest way to find the cover is when you google it: \"AC DC - Highway To Hell vinyl cover\".Run AddYourMusicToTheMod.exe. Depending on which folder the files is placed in, either a cassette or vinyl will be generated.After that, your cassettes and vinyl records will start spawning in the world, you just have to find them.How to add your music in the MULTIPLAYER:Video tutorial: https://youtu.be/b7SUjPzmgfM Create a new mod from the template: https://disk.yandex.com/d/iS8o8ZxnV7UxLA WARNING In the file mod.info change the ID to your own WARNING To ensure that your mod does not conflict with other True Music addons, you need to rename the files:media\\lua\\server\\Items\\TCGLoadingTCBoombox.lua\nmedia\\lua\\server\\Items\\TCGLoadingTCVinylplayer.lua\nmedia\\lua\\shared\\TCGMusicDefenitionsTCBombox.lua\nmedia\\lua\\shared\\TCGMusicDefenitionsTCVinylplayer.lua\nmedia\\scripts\\TCGMusicScriptTCBoombox.txt\nmedia\\scripts\\TCTCGMusicScriptTCVinylplayer.txt\nmedia\\scripts\\TCGSoundsTCBombox.txt\nmedia\\scripts\\TCGSoundsTCVinylplayer.txtFor example, add your mod Workshop ID to their names:media\\lua\\server\\Items\\TCGLoadingTCBoombox2722332157.lua\nmedia\\lua\\server\\Items\\TCGLoadingTCVinylplayer2722332157.lua\nmedia\\lua\\shared\\TCGMusicDefenitionsTCBombox2722332157.lua\nmedia\\lua\\shared\\TCGMusicDefenitionsTCVinylplayer2722332157.lua\nmedia\\scripts\\TCGMusicScriptTCBoombox2722332157.txt\nmedia\\scripts\\TCTCGMusicScriptTCVinylplayer2722332157.txt\nmedia\\scripts\\TCGSoundsTCBoombox2722332157.txt\nmedia\\scripts\\TCGSoundsTCVinylplayer2722332157.txt Send the mod to all users of the server (we allow to publish a mod created from the template) If you want to upload your work to Workshop, you will need to delete folders and files:\\media\\yourMusic\\audioConverter\n\\media\\yourMusic\\pictureConverter\n\\media\\yourMusic\\AddYourMusicToTheMod.exe\n\\media\\yourMusic\\DeleteYourMusicFromTheMod.exe\n [boosty.to][pz.ibrrus.ru][discord.gg]You can freely use this mod on your server. We publish information about mod update times on Discord in advance: https://discord.gg/PHhsuQxDueMod permission according to TIS policy: Ask for permission[theindiestone.com]Redistribution of this mod without explicit permission from the original creator is prohibited under any circumstances. This includes, but not limited to, uploading this mod to the Steam Workshop or any other site, distribution as part of another mod or modpack, distribution of modified versions. The product can be published on Steam only through an account with the name iBrRus.© iBrRusVersion:2.15Workshop ID: 2613146550Mod ID: truemusic",

        "id": "3118990099",

        "map_folder": "",
        "title": "True Music Jukebox B41",
        "description": "This version of True Music Jukebox is for Build 41. Norby has now updated it for Build 42 as well, and it can be found here. Keep in mind that Build 42 does not have multiplayer yet.Are you tired of swapping cassettes and vinyls after every track? Is the effort to find batteries doing more damage to your sanity than the zombie apocalypse, itself? Well, now you can load hundreds of cassettes and vinyls from the infamous True Music into a handy multipurpose jukebox and dance until you're undead! And the music syncs on multiplayer!1. First remove and then unsubscribe from the old version of True Music Jukebox! (!!!)2. Get True Music (and it's prerequisites)3. Subscribe to some good True Music track packs.4. Find or build yourself an epic jukebox (but don't forget electricity)!5. Turn it on, fill it with cassettes and vinyls, and crank it up to ELEVEN! *How to Use JukeboxesTo use a jukebox, simply interact with it once after finding or placing it in the world and turn it on. This will convert the jukebox into a container object. After that, you can move (or \"load\") True Music cassettes and vinyls into the jukebox. Once tracks have been loaded, you can play them using either any loaded track's inventory menu or the jukebox interaction menu. Powered jukeboxes will play continuously. You can create a queue of specific tracks that will play next in the loaded playlist, and you can lock the queue if you want to loop through a subset of loaded tracks.Jukeboxes can hold ELEVENTY arbitrary Zomboid weight units (110 AZWU) of your finest tapes and vinyl records. There is no track limit.By default, zombies will be attracted to the sound of the jukebox up to 50 squares away. The range at which zombies can hear a jukebox at full volume can be set using sandbox options.* Jukebox sound is controlled by Ambient Volume in sound settings.Jukebox Therapy and NutritionJukeboxes can be given the power to improve the moods and health of players who hear them in many ways; they can even quench your thirst if you want them to be that magical. These features are off by default; enable them in sandbox options if they are up your alley!Jukebox IconsThis mod features icons to help people navigate its menus nonverbally. All buttons still do what their button text says they will do; buttons that say \"play\", \"enable\", or \"turn on\" do exactly that. However, the icon for buttons that toggle things on and off will reflect the CURRENT state of that option, not the state it will be in after it's pressed. We made this decision because we wanted the icons to appear \"on\" when the associated toggle is \"on\" - e.g., the Jukebox icon is green when it's on. This pattern can be inverted on our game options page.Portable Jukebox KeysWant to remotely access a jukebox's playlist and queue? Simply enable portable jukebox keys via sandbox options, add a jukebox to your key ring via the jukebox's main menu, and open the context menu on your (or any) key ring to control the box at any range. You may rename jukeboxes to remember locations more easily. Controller input is supported via the in-game keyboard.Range OptionsIn sandbox options, you can determine the audible sound range of the jukebox (a special setting exists for zombies); note, however, that our option for players will only work if you use our custom sound mode (the default sound mode of this mod). If you are using Project Zomboid's 3D sound effects, however, be aware that we are not able to control the sound range; it will drop off in volume according to whatever is deemed realistic by Project Zomboid.Jukebox HeroWant to get a jukebox as fast as possible? Just choose the Jukebox Hero trait at character creation, and you will spawn with a Jukebox Starter Kit for building your very own jam station! You will also learn a recipe for making jukeboxes out of scrap.3D Audio EffectsTrue Music boomboxes and cassette players use 3D audio effects that many people find annoying because they have excessive bias toward one ear, and that ear is often the wrong ear (it's based on player position, not head orientation). We do not like the sound of that audio, so we replaced it with something we like much better. However, you may enable that form of 3D audio using both game options (for the individual level) and sandbox options (if you want to force your entire server to use the same 3D sound as True Music). Just be aware that we do not control the audible range of that sound mode.Multiplayer SyncWe have spent many hours confirming that you will hear the same songs as other people, and tracks will change at almost the same time. Feel free to contact us if you believe you have ideas that can significantly improve this aspect of the mod!We have not seen any desync in testing lately; however, if for some unexpected reason a jukebox does become desynced for one or more players, there are two things that will likely fix this. If the data is only wrong clientside, reconnecting should fix the issue; if the jukebox data is somehow corrupted serverside, then picking up a jukebox and putting it back down will reset its data.Game OptionsTrue Music Jukebox now has its own page in the Game Options menu, where players can control a wide range of settings from jukebox volume to hiding menu options.TranslationsWe want True Music Jukebox to be available to every player in every language! Please learn more via our permanent discussion about language support.Update ScheduleWe will push feature updates on Sundays at 10 PM EST whenever those updates are ready.Discord ServerCome join the True Music Jukebox community[discord.gg] on Discord! In the future, we plan to warn people there if we need to do an unscheduled update for any reason (such as bug fixes that we consider urgent). We are also able to respond to usage questions, bug reports, translation requests, and feature suggestions faster on Discord. Please join us!CompatibilityThis mod was written and will continue to be improved with compatibility as a high priority. It was tested alongside hundreds of mods, and it was fully compatible with all of them. It also integrates smoothly with Lifestyle: Hobbies. If you have any information regarding a potential incompatibility, please visit us on Discord and ping us!You can add this midsave. Starter kits and manuals will not spawn in places that the server has already initialized with items.ModpacksPlease read our Modpacks discussion.Other Mods by Norby007See my other mods for mixed insanity:SuperGigaMart - It's like shopping on Black Friday!FunctionalAppliances - Now with More Brews!Other Mods by BurryagaBurryaga is a Wookiee. Check out his Steam Workshop for a variety of useful mods!Workshop ID: 3118990099Mod ID: TrueMusicJukebox",

        "title": "Build 42+ UNSUPPORTED - Item Tweaker API",
        "description": "For Context: This mod was built during a time where new Zomboid modders would release mods containing entire files worth of item definitions, in order to only change a single entry, thus removing any changes a mod loaded previously would make. This mod mod makes use of code that Zomboid always had simply to make new modders know how to make mods more compatible. I honestly never intended for people to continue to use this mod for their mods for the last 9 years instead of discovering the real method behind how to do it themselves.That being said, while I appreciate the support, and the sheer number of people subscribing, I am going to keep this mod in a mothballed state, ending support for build 42 onward, but keeping it available to any mod still relying on it in build 41. Feel free to unsubscribe when the time for it comes, but it's still been quite a trip.",

        "description": "Hats and glasses don't fall to the ground, both for zombies and people! PayPal for the generous and thankful!  Donations are very much appreciated! [paypal.me] Item Tweaker API only needed for optional patches, not vanilla mod Are you're tired of hats and glasses lying on the ground everywhere, after you've cleared a large area of zombies?Did you find a pair of snazzy sunglasses, only to have some undead cop slap them right off your face, without a search warrant?What about those cool deputy hats for those special people who like to roleplay as Rick Grimes?They have surely felt the heartbreak of losing their hats in the forest, God knows where, because they stumbled on a ladybug while casually jogging, only to never see their hat again.Today Johnny Dollar brings you this very small and simple quality of life mod that completely disables hats and glasses falling to the ground, meaning you'll never ever have to worry about losing your +7 pair of prescription glasses, cool hats or even clean up after zombies, when your neighborhood looks like an American University at graduation day.Q: I use Authentic Z and hate to lose my cool hats or glasses!A: Not a problem, this mod offers an optional patch for that.But you must install ItemTweakerAPI for this patch to workQ: I use SWAT Riot Pack and I'm always sad when I lose my cool helmet!A: Just like above, that's not a problem! An optional patch for that is also offered with this mod.You also need ItemTweakerAPI for that.Q: Do I need ItemTweakerAPI for vanilla?A: No, luckily only when mods mess with other mods!Q: Why do I need ItemTweakerAPI for the patches?A: It's because some mods have trouble overwriting other mods, so the game can't figure out which mod to listen to.ItemTweakerAPI helps with that!Enjoy! Want to be able to tear up underwear or throw them into a fire? All credits for SWAT RIOT PACK goes to RilehAll credits for Authentic Z goes to Authentic PeachAll credits for Brita's armor pack goes         "map_folder": "",
        "title": "Has Been Read",
        "description": "In v2.14, support for Titled Literature (e.g. Books and Magazines) has been added. However, please note that these items, will be marked as \"Already Read\" they are read after enabling the mod or updating it. The icon display for these items can be turned off from the options.Overview :Add the unread mark on the book's icon that has not been read or has been read only halfway.Confirmed to work with Build 41/42 and also work on MP.Features :Books that have not been read will display the original icon with \"?\". This includes skill books that are no longer needed at current level.Books that have been read only halfway will display the original icon with \"!\".Books that have been read completly will display the original icon only.You can mark a book. For example, you can check to see if you got it or not. Marking can be done from the context menu of the target item.Options :These options are available with Mod Options in B41.Show \"Not Read\" mark (?) : Can specify whether to show or hide.Show \"Not Completed\" mark (!) : Can specify whether to show or hide.Show \"Already Read\" mark (v) : Can specify whether to show or hide.Show \"Not Completed\" mark as \"Not Read\" mark (! -> ?) : Can specify whether to change the display or not.Show \"Self Marking\" mark (/) : Can specify whether to show or hide.Show \"Current Target\" mark (o) : Can specify whether to show or hide.Show mark on Map : Can specify whether to show on Map.Show mark on Flier : Can specify whether to show on Flier.Show mark on Brochure : Can specify whether to show on Brochure.Show mark on Titled Literature : Can specify whether to show on Titled Literature. Show mark on CD : Can specify whether to show on CD.Show mark on VHS : Can specify whether to show on VHS.Show mark on HomeVHS : Can specify whether to show on HomeVHS.Auto Marking : Automatically mark when retrieved to your inventory (including holding containers).Reverse Marking Display : Reverses the display of Self Marking (defaults to all books with Self Marking displayed).Share Flier Mark : Can specify whether to share the flier marks.Share Brochure Mark : Can specify whether to share the brochure marks.Share Titled Literature Mark : Can specify whether to share the titled literature marks. Share Self Marking : Can specify whether to  share the self marking.Known Issues :For CD/VHS/HomeVHS, only the \"Not Read\" mark will be displayed, the \"Not Completed\" mark will not be displayed at this time and will be treated as unread.Future plans :Bug fix (if exists)Remarks :Modded books should also work as long as they comply with the vanilla's book-implementation.To make the map already read, the map must be read after enabling this Mod. Maps read before enabling this Mod will be displayed as not read.You may add it to your mod pack without confirmation and credit. However, please use at your own risk, as I have not been able to verify that it works with SP.Since v1.1, the implementation is very dependent on vanilla code. Therefore, I hope that the function of this Mod will be implemented on the vanilla side in the future.If you were unable to log in to the MP server due to an upgrade of this mod, please try the previous versions by downloading them from \"Change Notes\".Release Notes :v2.14 - Supported Titled Literature, improved compatibility with Inventory Tetris (B42).v2.13 - Supported Flier/Brochure, added share options.v2.12 - Supported options for Build 42.v2.11 - Compatible with Build 42.v2.10 - Added Auto Marking (Optional).Please refer to \"Change Notes\" for the older history.My most favorite mod, \"Pump Pury\" has been flagged as sensitive content and is no longer visible to many users. Please help rescue this mod!If you enjoy this mod and would like to support its development, you can do so through the services below. Your support helps keep me motivated and allows me to continue improving and updating the mod. All contributions will be used for development purposes, such as AI service subscriptions. \n\n[buymeacoffee.com]\n[ko-fi.com]\nWorkshop ID: 2544353492Mod ID: P4HasBeenRead",

        "title": "Easy Engine Rebuild",
        "description": "Gives the player the ability to increase not only the engine condition, but also the Engine Quality.How to rebuild an engine:1. Level your Mechanics skill level high enough to be able to begin repairing the engine.2. Repair the engine to a condition level of 90% or higher. You can stop at 90%, as rebuilding the engine will increase the condition to 100%.3. Collect the number of Spare Engine Parts needed to rebuild the engine in your inventory. The tooltip will show you the number, but it is currently 5 * <required Mechanics skill level>.4. Open the Vehicle Mechanics menu and either right-click on the engine part name in the parts list, or right-click on the engine icon on the vehicle diagram (for modded vehicles this requires the vehicle mod maker to have created a vehicle diagram).5. Click on \"Rebuild Engine\".After rebuilding the engine the Engine Quality will be set to 100, as will the condition. Both Engine Loudness and Engine Horsepower will be updated to match what they would be if the vehicle had spawned with Engine Quality of 100.Written for and tested in Project Zomboid version 41.53. Any earlier versions are untested.Workshop ID: 2577243435Mod ID: EasyEngineRebuild",

        "description": "Updated June 21, 2024: Fixed a bug where the lightbar would not be repaired if the condition was already 96% or higher. Lowered the skill requirements slightly and roughly doubled the condition increase for the number of parts needed.Gives the player the ability to repair the lightbar if a vehicle has one.How to repair a lightbar:1. Raise your Electrical skill to the level listed in the tool tip. This will vary by vehicle type and will be one level below what is required for the Mechanics skill to work on the engine, or level 5, whichever is less. If the current condition of the lightbar is 0%, this requirement will be increased by one level of the Electrical skill (but capped at level 6).2. Collect the needed parts to repair in your inventory. This includes Electronics Scrap, and Electric Wire. If the current condition of the lightbar is 0%, you will also need two (plain, without a named color) Light Bulbs and one Amplifier.3. Open the Vehicle Mechanics menu and right-click on the Lightbar in the parts list.4. Click on the \"Repair\" option in the context menu.The lightbar's condition will be increased according to how many Spare Electrical Parts and Wire you have in your inventory. Currently this is set to a 10% condition increase for every 5 Electronics Scrap and 1 Electric Wire.Written for and tested only in Project Zomboid version 41.53. Updated for Project Zomboid 41.78.16. All other versions are untested.Workshop ID: 2582648054Mod ID: EasyLightbarRepair",

        "title": "Auto Mechanics B41",
        "description": "So you are here ?Ah.. you wanna play with cars but you lack experience.You've come to the right place.At least if you are using B41 or previous versions.The version for B42 and further versions if here.All questions that are not answered below will be answered by the community on the Official Project Zomboid Discord[discord.gg] mod_support channel.How to ?Get a Screwdriver, a Wrench, a Lug Wrench and a Jack.Ensure you've read the book associated with your car.Find a car you can spare, and just start training with serenity.On vehicle mechanics menu, right click any mounted part and left click on Train Mechanics button.Mod OptionsWhen using the awesome ModOptions, you'll have access to these options.Verbose options are logs that reduce (a lot) performances: only for debug analysis.If your character does not reinstall desinstalled parts: increase the \"Delay between actions\".You can select a threshold for uninstall attempts depending on risks of breaking the part.You can use or not a pause at the end of all actions (e.g. when using time speed increase for a full training).You can re-try vanilla Uninstall and Install actions until they succeed.Sandbox OptionsYou can enfore the failure threshold server side in multiplayer.The lowest (most limiting) value between the client value (mod option) and the server value (sandbox option) is used.It is 0 by default.Tips and TricksRemember there is no need to train more than once a day (per car).You can increase game speed in solo mode.A mismatch between client and server with B41 Multiplayer? Follow the steps here[theindiestone.com].The training can reach a stall due to pathfinding. Keep a lot of free space around the car to avoid this.Broken items will be dumped. (items you uninstalled and cannot reinstall will not be. e.g. a tire will not be reinstalled nor dropped if the suspension is broken and dropped)Make sure to disable re-equipment before \"Train Mechanics\" if you're using the Tidy Up Meister mod.This mod can be added to or removed from any save (both MP and solo).Project Zomboid gives much freedom to players and modders, but there are tricky stuff I will not explain a thousand times in the comments below.CreditsCompatible B40&B41 multiplayer thanx to MamaKonda[theindiestone.com].Uninstall all integrated from Deadly_Shadow's \"hack\".On Lockdown[theindiestone.com]This mod cannot be modified by anyone else, for anything else, at all, ever. Even if the user disappears, he or she would much rather you didn't touch the fruits of their hard labour.That's it.Why are you still here ?There is nothing more for you here. Get lost !.. let me remember my first student, sweet Kaylee..Workshop ID: 2588598892Mod ID: AutoMechanics",

        "description": "Ever regretted hotwiring that sweet sportscar? Ever got your hotwired car stolen by your friend and who then (somehow) managed to flip it? Or do you just want to become a local car key salesman, perhaps a famed car keysmith?Then you're in the right place!Refined Hotwiring allows you to un-hotwire your hotwired car or, with a little metalworking knowledge, create keys for them, all from the comfort of your vehicle radial menu.Completely works and supports your favourite (vehicle radial menu-using) mods:- Better Lockpicking- Harry's Functional Tow Truck- Autotsar Trailersand more!Features and skill requirements:- Now featuring Custom Sandbox options, made singlehandedly by albion! Change the skill requirements of un-hotwiring and keycrafting to better fit your playstyle!- Un-hotwiring! Removes the hotwiring from the car, allowing it to be started using a key.Requires Electrical 2 and Mechanics 3 and takes 500 units of time to complete.- Key crafting! Gain a key to the car you're sitting in.Requires Electrical 1, Mechanics 2 and Metalworking 3, and takes 1250 units of time to complete.- Base hotwiring is unchanged!It still requires Electrical 1, Mechanics 2 or the Burglar skill, and takes 200 units of time to complete.The time needed to complete these tasks get shorter the higher your Electrical knowledge is!Does something not work as it should?Please visit the mod's github page and open an issue under the \"Issues\" tab, or comment below using the Steam Workshop comments system. I will do my best to help!Please give feedback on the mod!For now, the Burglar trait does not allow you to bypass skill requirements for un-hotwiring or crafting car keys, because in my mind, Burglars learnt to break into homes and cars, but not how to delicately craft car keys or undo their damage. If you think this should be changed, please make yourselves heard!Mod's github page: https://github.com/VilcsiTH/refinedhotwiringOriginally based on raz's \"Harder Hotwire\"         "id": "2757712197",
        "url": "https://steamcommunity.com/sharedfiles/filedetails/?id=2757712197",
        "mod_id": "Vehicle Repair Overhaul;Vehicle Salvage Overhaul",
        "map_folder": "",
        "title": "Vehicle Repair Overhaul",
        "description": "B41 and B42 COMPATIBLE  Find a clunker you love but its one zombie tap from disintegration? Fix it up!Repair and Salvage - Vanilla Vehicles and all the great Workshop Vehicle Creations!!Adds many more repair options for Hoods, Trunks, Seats, Doors, Gas Tanks, Lights, Windshields, Windows, Tires, Brakes, Suspension, Glove box, Roof Racks, Trailers, Cargo Containers, Armoured Parts & other Vehicle Accessories or Salvage the whole vehicle too removing it from your path!New Items includedFix A Flat - Tire Repair - This will get you by until you switch out the tires - Can be found in Vehicle Trunks.**You can combine cans that you find**  This mod is safe to add or remove from your existing saves   Repair & Salvage The aim of this mod is to let you repair and fix up your vehicle(s)and will bring more focus and choices for the mechanics and metal welders amongst us -works in MP and SP (and can be installed or removed anytime) -with a shortage of working cars on some servers you can now fix up what you find -have a mechanic in your group? put their skills to use -collect cars and restore them to their former glory -learn your craft and progress, become that master mechanic you always wanted to be -grab your blowtorch and break down many vehicle parts into useable items -salvage the complete vehicle for many useful items depending on your skill -compatible with all vehicle additions on the workshop  -built-in support for Valhalla Vehicle Ownership module  Repair your rideUse varying parts to restore your ride -start easy changing tires then with seats, have some ductape, sheets, glue, a spring? you can repair it! -Parts have a lot more uses now, from metal bars and springs to rebuild the suspension, light bulbs for light, fabrics for seats and good old ductape for many minor fixes -Screws and metal for moderate fixes but progress to using a blow torch and your repairs will be solid!  Salvage of Vehicle and PartsSalvage parts from one vehicle and use the pieces to repair other parts on other vehiclesGrab your blow torch and mask to break down vehicle parts into useable items!Salvaging Vehicle parts could provide you with several items in return!Tear up those old stinky seats and you'll have a chance of gaining those dirty Rags, Leather, Denim or Thread!Grab your blowtorch and mask, uninstall those beat-up doors and salvage them for a chance of Metal Sheets, Screws, Small Metal Sheets or even Electronical Scrap!Enjoying those mods that introduce Roof Racks? Well now you can salvage those too!Each Vehicle part can be salvaged with a chance of gaining up to three salvaged items depending on your Mechanic and Welding skills.Salvage Vehicle is now includedRight click on a vehicle and choose \"Salvage Vehicle\"This option is available once you have Metal Working skill 4 or above, Mechanics skill 3 or above and requires 10 propane units and a Welders Mask. You can salvage all vehicles except Wrecks*.This option will completely salvage and remove the vehicle clearing the path.Depending on your Metal Working skill, you will salvage the vehicle faster and receive many useful items the higher your skill.I do recommend removing as many parts of the vehicle as you can and empty the vehicle before salvage of the vehicle body. This will give you vehicle parts to use, further salvage options for those parts and your character will have gained more knowledge about vehicles and gained more skill XP in Mechanics and Metal Working.The Vanilla option for *dismantle wreck option is also still available (only for wrecked vehicles), takes less time but your returns are smaller and less varied with less XP too.The better you are at Mechanics or Metal Welding will mean your talents will produce better results from the Salvage!A Mechanic knows the parts he wants, gaining skills in Metal Welding means he can better acquire those parts.  Suggested workshop items that add to the experienceMany Vehicle mods on the workshop are already supported with this mod ! The list below are some of my favsKI5's VehiclesCyt VehiclesSharks VehiclesTread's Water Tank TrucksCrashed CarsCraft Helper ContinuedViperels Vehicle Spare Parts  CompatibilityGood with everything!! I do not overwrite vanilla code, I create additions so it plays nice with any other mod you want to use.**Place this mod after any vehicle mods or towards the bottom of your mod order for best results**  NOTESHeater repair and Lightbar Repair and Salvage will come eventually to this mod. It requires a different method of coding compared to the regular vehicle repairs and unfortunately I just haven't had the time to incorporate it.For now I suggest the \"Easy Heater Repair\" and \"Easy Lightbar Repair\" mods. (B41)The B42 version now has updated versions of Easy Heater Repair and Easy Lightbar Repair integrated into it. Credit to PipMagnet for the original mods. If they return and want them removed, I will do so.  Contributing on GitHubIf you have a translation or want to help add repair options to new vehicles and you know how Project Zomboid scripts work, you can make a pull request on GitHub[github.com]  Thanks toTrealak, DJVirus and all the modders who offer help with code and of course Vehicle creators like filibuster, KI5, fhqwhgad, Diegus, cyt and shark.Special Thanks to Tofuman!TranslationsPolish Translation by ?DOM.0?French Translation by KwerTTYRussian Translation by Macintosh.German Translation by Thanit.Chinese Translation by UnsetLay.Brazilian Portugese Translation by peteR 75hz.Thai Translation by Riko Prushka.Turkish Translation by GKarahan.Updated Italian Translation by FalborWorkshop ID: 2757712197Mod ID: Vehicle Repair OverhaulMod ID: Vehicle Salvage Overhaul",

        "description": "The auto-return feature included in this mod has been added to the vanilla game as of Build 42.8.0. However, the vanilla implementation currently does not support certain actions, such as cocking guns, magazine operations, or returning items placed on the ground. As some behaviors are still only covered by this mod, I hope you’ll continue to find it useful.Overview :Automatically returns to the original equipment when the operation is completed.Confirmed to work with Build 41/42 and also work on MP.Features :When an action that switches equipment when performed, such as dismantle, is completed, the equipment is automatically restored to its original state.When automatically returning equipment, if the equipment was in a container, it will be returned to original container.You can toggle whether or not to re-equipment from the context menu. This setting will continue in each character, so you can use it when you want to continuously dismantle.For details, please check the introduce movie above.Additional Actions :These actions can be toggle enable/disable with Mod Options.Build actions (Metalwork / Carpentry)Firearms actions (upgrade / magazine / bullets / rack)Fitness actionsEat food actions (Including lighter/match on Smoking)Take pills actionsReading actionsMedical actionsLight fire actionsRefueling actions Options :These options are available with Mod Options in B41.Force Re-Equip : Normally, it will not be re-equipped when the operation is interrupted, but turning it on will force to be re-equipped only hand-held items.Use Context Menu : Allow the context menu to toggle between re-equipping and not.Restore Original Location : When returning used items to the ground, they will be restored to their original placement location. Supported Mods :Bath Towels OverhaulBetter Lockpicking (Including based on Better Lockpicking)Common SenseInventory TetrisPicking Meister (Only in B42)Skill Recovery JournalKnown Issues :NothingThis mod contains many         "title": "Rewarding Night Combat",
        "description": "Do you frequently find yourself wanting to venture out during the night but struggle with motivation? If so, this mod is for you. With it, you will have the opportunity to gain significantly more experience points for your combat skills during nighttime.By default, bonus experience points will be applied to combat skills between the hours of 11 PM and 6 AM as follows:  Axe: \t 1.5x ⇔ 50% XP bonus  Long Blunt: \t 1.5x ⇔ 50% XP bonus  Short Blunt:\t 1.75x ⇔ 75% XP bonus  Long Blade:  \t1.5x ⇔ 50% XP bonus  Short Blade: \t1.75x ⇔ 75% XP bonus  Spear:  \t1.5x ⇔ 50% XP bonus  Aiming:\t 1.5x ⇔ 50% XP bonus★ Can be added/removed mid-save!CustomizationWithin this mod, you have the flexibility to customize various details according to your preferences using the sandbox settings. These customization options are categorized as follows:Core  Specify starting and ending hours for each season (Summer, Autumn, Winter, Spring)  Adjust bonus multipliers for all combat skills.  Set the probability of triggering at the starting hour (default: 100%, equivalent to every day).  Define the number of days before the mod begins (default: 0, meaning it starts immediately on the first day).Optional  Enable a suspenseful sound effect that plays when bonus XP is activated.  Activate an indicator icon that displays information about currently applied bonuses through its tooltip.  Make the indicator icon draggable; you can move it by clicking with the left mouse button, release it, or reset its position using the Backspace key (the new position will be saved).  Choose from among six different color options for the indicator icon. Advanced  For more advanced customization options, consider using the supplementary mod Rewarding Night Combat Server Options! and follow its accompanying guide. With this mod, you can:   Incorporate and utilize your custom indicator icon.  Adjust the default position and size of the icon.  Add your custom text to the tooltip.  Disable the tooltip if desired.  Add and use your custom trigger sound effect.  Add and use your unique ending sound effect.    Refer to the 4th preview image for an illustrative example of these advanced customization options.Supported LanguagesFor in-game tooltip  All the official languages in the gameFor sandbox settings  English  Turkish  Korean  (by Marmelade!)  Spanish (by Chillax!)  Polish (by Enzoo | Nulled)RecommendationIf you are seeking a challenge that significantly justifies the experience gains provided by this mod, I recommend pairing it with the Night Sprinters Mod. If you find Night Sprinters to be exceptionally difficult, you may also consider using the Slower Sprinters, which offers varying degrees of reduced sprinter speed (25%, 50%, or 75%).If you would like to support me: https://ko-fi.com/nihilistpenguinWorkshop ID: 2781963981Mod ID: RewardingNightCombat",
