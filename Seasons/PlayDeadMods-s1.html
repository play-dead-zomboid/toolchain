<body>
    <div id="app" class="container mt-4">
        <h1 class="mb-4">Play Dead: Steam Workshop Mods</h1>
        <div class="row">
            <div class="col-6">
                <div>
                    <button @click="copyToClipboard(modIdsString)">
                        Copy Mod IDs
                    </button>
                </div>
                <div>
                    <button @click="copyToClipboard(workshopIdsString)">
                        Copy Workshop Item IDs
                    </button>
                </div>
                <div>
                    <button @click="copyToClipboard(mapIdsString)">
                        Copy s
                    </button>
                </div>
            </div>
            <div class="col-6">
                <input v-model="searchQuery" type="text" class="form-control" placeholder="Search by Workshop ID, Mod ID, or Title">
            </div>
        </div>
        <div class="mb-3">
            <label for="tagFilter" class="form-label">Filter by Tag:</label>
            <select v-model="selectedTag" class="form-select">
                <option value="">Show All</option>
                <option v-for="tag in allTags" :value="tag">{{ tag }}</option>
            </select>
        </div>
        <div class="row">
            <div class="accordion col-6" id="workshopAccordion">
                <div v-for="(mod, index) in filteredMods" :key="mod.id" class="accordion-item">
                    
                    <h2 class="accordion-header" :id="'heading' + index">
                        <button class="accordion-button" type="button" data-bs-toggle="collapse"
                            :data-bs-target="'#collapse' + index"
                            @click="setActiveIndex(index)">
                            {{ mod.title }}
                        </button>
                    </h2>
                    <div :id="'collapse' + index" class="accordion-collapse collapse" data-bs-parent="#workshopAccordion">
                        <div class="accordion-body">
                            <p><strong>ID:</strong> {{ mod.id }}</p>
                            <p><strong>Mod ID:</strong> {{ mod.mod_id }}</p>
                            <p v-if="mod.reason"><strong>removed because:</strong> {{ mod.reason }}</p>
                            <p><strong>Tags:</strong> <span v-if="mod.tags.length">{{ mod.tags.join(', ') }}</span><span
                                    v-else>Other</span></p>
                            <a :href="'https://steamcommunity.com/sharedfiles/filedetails/?id=' + mod.id" target="_blank">View
                                on Steam</a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div v-if="activeIndex !== null && filteredMods[activeIndex]" class="card">
                    <div class="card-header">
                        <h5>{{ filteredMods[activeIndex].title }}</h5>
                    </div>
                    <div class="card-body">
                        <p>{{ filteredMods[activeIndex].description }}</p>
                    </div>
                </div>
            </div>
        </div>

ription)You can \"find\" an open door on a locked vehicle. This means one random door gets unlocked (mostly at the back), not all or the driver's door. (Description)Create new keys for vehicles without losing functionality of existing ones (Description)Repair vehicles from the context menu (Description)Remove single or all vehicles in your cell (Description)Unlock vehicle trunks and containers from the context menu (Description)Hide / show equipped hand items on enter / leave vehicle to increase immersion when player is visible in the vehicle (Description)Detailed module descriptionsTo shorten this page I have moved the feature overview here.Available languagesEN | DE | CN (S) | PTBR | RU | CN (T) | ES | FR | TRIf you want to translate this mod into other languages, put your translation here. I will include it with the next update.DisclaimerAlways back up your saves properly. Automations don't always work with max speed, which I can't work around. Speed 2 is alright in most cases. Beware of automatic level changes when the game is lagging, as it might crash. If you choose the \"fun sized\" radius options, it's on you if something crashes.ThanksKI5 for creating the mod poster and helping me with the screenshot graphics. I am an absolute idiot with image editors. Additional thanks for encouraging me to finally create a mod and learn lua, and many of the ideas to the modules included in here, as well as testing of the mod. If you've been living under a rock, here's his workshophollaming, desze, naHDa, Person B, XpaDDer, SeaMustard, KeanuRaves, ASPbazi! and 雨季安魂夜 for their translationsOther stuffIf you like the mod and want to help me, please don't forget to rate it. Also please consider donating a coffee[ko-fi.com]. It would mean a lot to me.[ko-fi.com]Originally posted by author:Do not copy, modify, redistribute, or repackage this mod without explicit permission from the creator. This includes on or off of steam, within another mod or modpack, or a different modified         "mod_id": "BTSE_Base",
        "map_folder": "",
        "title": "[B41 MP only] bikinitools: Server Edition",
        "description": "This mod is a passion project and not a commissionIts development has been fuelled by the generous and continued support of the following communities (in alphabetical order):A Path Above[discord.gg]Dawn Of the Dead[discord.gg]MiazmaProject Apocalypse[discord.gg]Sunday Drivers[sundaydrivers.pro]Z's Fun Server[discord.gg]Zomboid EvolvedWithout them I would have given up long ago.Feel free to use these mods on your servers, but do not copy, modify or otherwise redistribute files or code contained within. The individual modules can be enabled on a submod basis and customized via sandbox options.This mod is provided with Linux filesystem capabilities in mind. If you do not have a Linux server you need to require users to not create usernames with chars that are invalid for NTFS. BTSE_Chat: Command module and chat overhaulThis submod is the foundation of a custom command module. Do not use this with other chat mods like the Chat bubble one or these \"join/leave\" things. It is supposed to be used standalone. In short it contains:Full chat system overhaul. Radio text channels in tabs, faction chat tab and more. No /whisper, no /all chat.(optional) Role playing chat features galoreComprehensive loggingStarter kits you can define and that can be turned in once per userAvailable commands can be checked by checking the commands guide on top of the chat window. The available commands depend on the access level of the user. This mod still uses the vanilla chat methods under the hood and therefore is subject to their flaws (specifically logging) too.BTSE_Economy // How to set up prices and shopsBanking system like in the olden days - area locked by sandbox options and with custom ATM tiles. Includes fees, taxes, interest and more. Player stocked vending machines, integrated into the currency systemIntegrated global shop for vehicles and items, bought and spawned by the users themselvesWipe proof. Data is stored on the server in Zomboid/Lua/parp_bankBTSE_Locks // Keypads and you: a short FAQAdds keypad lock functionality (password protection) to doors. Keypads can be crafted or installed for free by staff members.BTSE_TileProtect:Allows for a variety of included options to protect the world from griefing and destructive actions. Allow / forbid pickups or destruction of various objects and sprites. Comes with sprite whitelist and blacklist, user whitelist, various predefined container type exclusive pick up options. Includes options to log movable actions. To have this work properly you need to set these vanilla sandbox options to have the actions policed by the mod, not the game:AllowDestructionBySledgehammer = trueSledgehammerOnlyInSafehouse = falseIt is not only the spiritual successor to ValhallaAegis' container protection, it is vastly improved. If you use this submod, disable the container protection in ValhallaAegis.BTSE_Tools:Contains mostly admin tools, logging and specialized commands as well as lots of QOL things to adjust your server environment.BTSE_Farming:Does not add any crops, but it adds tons of error handling and checks for the vanilla farming system. Allows you to remove farming mods safely and you can add crops very easily from within your own server mod. Do not redistribute the contents of this (use this as requirement and load it before you add your own crops) and check BTSE_Examples for an easy showcase and detailed descriptions on how to add your own stuff.This does the same as my old \"Just tomatoes\" mod and more. Enable this one - even empty - and you're protected during the removal of farming mods which would otherwise be breaking the server.Just like it is usually with farming: do not expect this to get along with other farming mods. It was and is meant to replace those with an inhouse mod specific to servers. The only exception that will 100% work is More Smokes.BTSE_RestorePods:A server side implementation (as far as this game permits) of a character save and restore mod with the twist that you can not only use the regular restore tokens but also a pod tile based system depending on what your server wants. Click here for the the full description. Sprite work was done by KI5.BTSE_Blueprints:Copy and paste areas of the map, even between servers and game modes, as long as the tilepacks are available. Has a blueprint library feature and you can share blueprints like in Factorio. IMPORTANT INFOS AND EXAMPLE HEREBTSE_Legacy_SecExp:Contains various helpful options to combat exploits and and the anti cheat stuff (which is not maintained anymore) that was formerly within BTSE_Tools. Do not expect all of it to work against modified clients.BTSE_Examples - do not enable or copy the full mod:Urgently check this if you want to:Implement custom payment functions or currencies. It is super easy and there is no need to copy / override the whole mod for this.Set prices for the ingame shop (global item / vehicle shops)Set goods exchange values (cash for loot at the bank / ATM)Configure available starter kits and their contentsAdd new crops handled by the farming submodLeverage multiple methods of tile protectionOther stuffIf you like the mod and want to help me, please don't forget to rate it. Also please consider donating a coffee[ko-fi.com]. It would mean a lot to me.[ko-fi.com]Originally posted by author:Do not copy, modify, redistribute, or repackage this mod without explicit permission from the creator. This includes on or off of steam, within another mod or modpack, or a different modified version. If no permission is received you may not alter the mod, and it must be treated as a mod that is 'On Lockdown'.© 2022+ bikinihorst -------------------------------------------Workshop ID: 2784972075Required for EVERY module in here:Mod ID: BTSE_BaseModulesMod ID: BTSE_BlueprintsMod ID: BTSE_ChatMod ID: BTSE_EconomyMod ID: BTSE_FarmingMod ID: BTSE_LocksMod ID: BTSE_RestorePodsMod ID: BTSE_TileProtectMod ID: BTSE_ToolsOld security stuff. Some things are blocked by cheat tools.Mod ID: BTSE_Legacy_SecExpExamplesMod ID: BTSE_Examples",

        "url": "https://steamcommunity.com/sharedfiles/filedetails/?id=2812491628",
        "mod_id": "MoreLootSettings",
        "map_folder": "",
        "title": "More Loot Settings v1.3.6 [41.78]",
        "description": "v1.3.6 (Nov 25th 2023) :- Fixed incompatibility with 'The Workshop' mod in multiplayer- Fixed female zombie loot not being affected by custom zombie lootPlease check the mod's description before asking questions.This mod adds custom loot options to the Sandbox Settings, including:- A zombie loot multiplier (affects loot of generic zombies, special zombie outfits, and bags)- A global chance of attached/lodged weapons on zombies (default is 6%)- A chance of attached/lodged long blades on zombies (default is 1)- A chance of attached/lodged hunting knives on zombies (default is 5)- A days passed required for attached/lodged weapon spawns on zombies (can be none, quarter, half, normal or double)- An option to set the number of max rolls for ALL loot tables (see Max Rolls section for more info)- An option to set the number of max rolls for FOOD loot tables (see Max Rolls section for more info)- 13 different item chance multipliers for many categories of items (they don't affect zombie loot)- An exceptions list ( a semicolon-separated list of items that will not be affected by the multipliers above)- A specific items multipliers list ( a semicolon-separated list of items with multipliers)- The number of cigarettes found per loot (default to 20 in vanilla)- Specified loot modifiers displayed for vanilla rarity settings: Extremely Rare (x0.2), Rare (x0.6), Normal (x1), Common(x2) and Abundant(x3).\"I just want less loot than Extremely Rare\" Still set everything on \"Extremely Rare\" Set the Global Max Rolls option at 1, 2 or 3 Set all the chance multipliers to a value below 1\"I just want less food\" Still set Fresh Food and Canned Food on \"Extremely Rare\" Set the Food Loot Max Rolls option at 1, 2 or 3 Set the Food Chance Multiplier to a value below 1 Also set the House Story Chance on Extremely RareWARNING:The chance multipliers are applied ON TOP OF the standard loot rarity options. (Insanely Rare, Extremely Rare, Rare, etc.)Exceptions List:A semicolon-separated list of items IDs. Useful is you want to spare an item from the loot multipliers. Looking at you, Sledgehammer.Example:Base.Sledgehammer;Base.Sledgehammer2;Base.Saw;Base.NailsBox;farming.HandShovel;camping.CampingTentKitNote : The items in this list will still be affected by the Specific Items Multipliers List below !Specific Items Multipliers List:A semicolon-separated list of items IDs and multipliers values. Useful to apply individual nerfs or buffs to the loot chances of specific items. Also applies to the items in the exception list above.Example:Base.Sledgehammer:5;Base.Sledgehammer2:5;Base.Saw:0.5;Base.NailsBox:2;farming.HandShovel:0.1;camping.CampingTentKit:0.1Note: you could also remove an item from the loot tables by giving it a chance multiplier = 0.Global Max Rolls and Food Loot Max Rolls:Rolls affect loot tables, not item chances like the chance multipliers.All loot table have a \"rolls\" key. Most tables have its value at 4, but some have it at 1, 2, 3 or 5. It is directly linked to how many items the table will spawn.If set at 3, all tables with a rolls value at 4 or 5 will be set to 3. But not those who have their rolls value at 1 or 2. It is a \"MAX rolls\" setting.Since most tables have a rolls value of 4, here's what you can expect for each setting: 1 : loot will be reduced by ~75%. (basically what \"Ridiculously Rare\" mod does.) 2 : loot will be reduced by ~50%. 3 : loot will be reduced by ~25%. 4 : only a few unimportant tables will be affected. Pretty much no impact on the loot. 5 : default vanilla value.Items added to zombie lootA semicolon-separated list of items IDs and chances that will be added to generic zombie loot. (the \"inventorymale\" loot table) (Added AFTER the multipliers are applied)Example:Base.Money:0.01;Base.Hammer:0.001;Base.Nails:0.05NEW in v1.2 There are now many options for many zed categories (military zeds, police zeds, medical zeds...). As well as a customized list of outfits that will drop a custom list of items. The format is the same as the example above. If you want to know which outfits belong to which category, see the list of zed outfits in the Discussion.Warning: With these lists, if you make a typo and an error occurs (red box bottom right), it is possible that the distribution tables completely reset to their vanilla state.CHECK THE LOOTZED TOOL IN DEBUG BEFORE REPORTING A BUG.The mod \"Time Decreases Loot\" is INCLUDED in More Loot Settings.For more info on this, check out the standalone mod Time Decreases Loot  .Some people say it works good. Other people say they have their sandbox settings get reset to their default value. This can be avoided by directly changing the default values in the mod's files.I can't test it myself so I don't really know.Time Decreases Loot can be finnicky in multiplayer. You MUST disable the trigger on dead bodies and the trigger on proximity. Yoy may also need to disable triggers on vehicles.- Map mods like Pitstop : As of v1.1.1, fully compatible- Better Sorting : Fully compatible.- Ridiculously Rare : Fully compatible. (rolls are set to 1)- Smoker : you will need to set the 'number of cigarettes' option to 1.- True Music : As of v1.3, fully compatible.- Better Sorting : fully compatible.- Mods that change item display categories (except Better Sorting) will work but item chances may not be multiplied correctly as intended.- Mods that add items or tweak distributions: Compatible, as long as they set standard display categories for them.It's recommended to run my other mod \"Vanilla Loot Tables Fixed\" along with this, but it's not strictly necessary.Workshop ID: 2812491628Mod ID: MoreLootSettings",

        "description": "This contains 4 mods. PICK ONE.  -75% FOOD Loot: decreases the food loot by 75% (1 roll per table, same as the mod \"Ridiculously Rare\")  -50% FOOD Loot: decreases the food loot by 50% (2 rolls per table)  -25% FOOD Loot: decreases the food loot by 25% (3 rolls per table)  Zero FOOD Loot: removes almost all the food loot (0 rolls per table) (doable in vanilla, but I left it there because apparently some people still need it)Applied ON TOP OF the vanilla loot rarity settings (None, Insanely Rare, Extremely Rare, Rare, Normal, Common, Abundant)WARNING: Not perfect. Some rare food items may slip through the cracks. If you want absolutely all food items to be affected, please use my other mod \"More Loot Settings\" and use the Food Chance Multiplier setting.CompatibilityDon't us this with \"More Loot Settings\".Compatible with mods that add items to the distributions.Compatible with the \"75 % Less Loot\" mod and its variants. It will prioritize the lowest/rarest loot.Example: If you enable 50% Less Loot and 75% Less FOOD Loot at the same time, it will decrease ALL loot by 50 % except FOOD loot which will be decreased by 75%.Example 2: If you enable 50% Less Loot and 25% Less FOOD Loot at the same time, it will simply decrease ALL loot by 50 %.Workshop ID: 2824073041Mod ID: 25PercentLessFoodLootMod ID: 50PercentLessFoodLootMod ID: 75PercentLessFoodLootMod ID: ZeroFoodLoot",

        "description": "Simple Overhaul: Traits and Occupations or just SOTOPlease, rate mod for promotion. It will motivate me to make more content! Thank you <3ALCOHOLIC TRAIT IS DISABLED IN B42Features:- Rebalanced vanilla occupations, making all of them worth to pick.- Rebalanced vanilla traits, some of them was completely reworked.- Adds more than 40 new balanced and necessary traits.- Adds 26 new vanilla-friendly occupations: Tailor, Deliveryman, Loader, Truck Driver, Soldier, Botanist, Grave Digger, Dancer, Priest, Weightlifting Instructor, Detective, School Teacher, Cleaner, Stuntman, Gas Station Operator, Camp Counselor, Drag Racer, Junkyard Worker, Lifeguard, Demolition Worker, Butcher, Paparazzi, Miner, Store Employee, Criminal, Animal Control Officer.- New unique traits for vanilla and SOTO occupations.- You can earn or lose traits while playing the game. For example, you can become Baseball Player, Brave or quit Smoking.- Visual style that matches the original game.- Sandbox Options.This all-in-one mod is standalone, which means you don't need anything else to make it work.This core mod changes traits and occupations from vanilla game, also adds more new features.Balance and flexibility are two fundamentals.Fair traits costs and no cheating.Meanwhile trying to still be close to Vanilla-style gameplayWorks in [B41/B42]Mod should work completely fine in singleplayer and multiplayer.Only for fresh game. Unknown bugs can appear with adding it in current savegame.Summary:* Most overpowered traits nerfed.* Most underpowered and unpopular traits buffed.* Occupations balanced around same way. Occupation start with maximum +2 skill level (except Farmer, Chef and Doctor).* If you want to understand mod ideology you should check Questions and Answers.You can find more info about all this stuff here (Google Sheets):>>> https://docs.google.com/spreadsheets/d/1FlcV3lKgHqfWixly7OwRVYnJHQJ7XhaH5XEHRwEF2DY/edit?usp=sharing <<<You should copy-paste this link in browser because Steam not allowing to open Google Sheets directly.First tab for Traits, second tab for Occupations.Traits and occupations are balanced from time to time to achieve the ideal state.Don't be surprised if your favorite trait or occupation buffed/nerfed.You can discuss this mod in comments or in my discord: https://discord.gg/sSBnUxADDKRecommended mods:- More Description for TraitsCompatible with:- (mostly everything but incompatible mods)- Smoker- Better Lockpicking (traits)- Snake's Mod Pack (weight traits)- Green Fire (alcoholic mutually exclusives)- Scavenger Skill and Driving Skill (skills for some occupations)- Excrementum (Sensitive Digestion trait)- Skill Recovery Journal- Evolving Traits World: should works fine but with bunch of +1 traits.SOTO may work bad or be incompatible with next mods:- any mods which changes vanilla traits and occupations- any traits which changes Smoker trait and adding Alcoholic trait (required testing)- Quit Smoking: SOTO already allow you to quit smoking.- Become Desensitized/Brave: SOTO already allow you to earn Brave/Desensitized traits.- Extra Traits Effects: both mods affecting same traits, incompatible traits balance. (but you can load ETE after SOTO to make it work.)Incompatible (and will not be):- More Simple Traits: SOTO is expanded MST. You may face duplicated traits and unknown errors. Use SOTO or MST.- More Traits: some traits will not work or work incorrectly, incompatible traits balance. Use at own risk.- Dynamic Traits: both mods affecting occupations and traits, while doing pretty the same thing in different ways, incompatible occupations and traits balance.- Occupations Expertises & Balance: both mods changing occupations and I don't want to see traits from both mods at same time, incompatible occupations and traits balance.- 10 Years Later Professions and Occupations: both mods affecting occupations, incompatible occupations and traits balance.You always can ask your fave mod developer to add compatibility with SOTO.I will not make separated occupations mod, do not ask me for.Translation:English, Russian, Chinese (traditional and simplified), Turkish, Korean.German, by XantosPortuguese Brazilian, by CinisshSpanish (ES, AR), by SeccioItalian, by Lore11French, by UnknouetThai, by Riko PrushkaPolish, by Enzoo | Nulled, GlazsUkrainian, by SWolfEvery feedback or bug report helping a lot!Big thanks to authors of \"Dynamic Traits\" and \"More Traits\" mods for their support in the development of this mod.You can support me on Boosty[boosty.to]!You can check out my other works:This mod can only be modified with the express permission from the original creator. When obtaining permission, you must credit the original creator in the files and in the description.\nIf no permission is received you may not alter the mod, and it must be treated as a mod that is 'On Lockdown'.\nYou can add this mod to your mod pack without the permission of the original author in its original form, provided that the mod is properly updated when new versions are released.\n\n© Hea 2022-2025Workshop ID: 2840805724Mod ID: SimpleOverhaulTraitsAndOccupations",

    {
        "id": "2932853467",
        "url": "https://steamcommunity.com/sharedfiles/filedetails/?id=2932853467",
        "mod_id": "WeaponModifiersRealistic",
        "map_folder": "",
        "title": "Weapon Modifiers v1.1.3",
        "description": "Update 1.1.3MOD COMPATIBILITY UPDATEAdded two new sandbox settings : Chance multiplier for CRAFTED RANGED weapons : default = 0. Leave this on 0 if you are using Brita's Weapon Pack ! Chance multiplier for CRAFTED MELEE weapons :  default = 0.75. =  - 25% chance of giving modifiers to melee weapons.As always,  see the changenotes for more details.The Sandbox Settings of this mod are slowly but surely getting out of hand... I will try to stop adding more sandbox settings in the future updates, otherwise it's gonna end up like More Loot Settings.What is this mod ?This mod adds weapon modifiers that give bonus (or malus) stats to weapons.Each weapon has a (customizable) chance to get a modifier. Then the quality of the modifier is also customizable through a \"rarity tweaker\" that makes it more or less likely to get higher or lower rarities on modifiers.These two values also depend on a \"start day\", a \"peak day\" and start and peak values. (Same system as my other mods Time Decreases Loot and Time Decreases Car Condition, if you know them.)You can also adjust specifically the chance of ranged weapons getting a modifier, and the chanced of weapons attached to zombies getting a modifier.By default in the Sandbox Settings, start day is set to 1 and peak day to 60. The chance to apply a modifier on a weapon will slowly increase from 40% to 65% until it reached day 60. And the rarity tweaker is set as 1.2 on start day (lower quality modifiers) and 0.8 after peak day (higher quality modifiers)To help visualize the stats of these modifiers, an extensive tooltip has been added to weapons, to showcase their stats, and the bonus given by their modifier - if they have one.This contains 4 mods,  don't enable all 4.You will need to enable the \"Framework\" mod, AND choose one of the other two mods \"Extensive Modifier List\" or \"Realistic Modifier List\".Then, if you want, you can also enable the optional addon mod \"Tinkering Skill (Reforge)\" that adds a Tinkering skill and a Tinker action that allows the player to reroll a melee weapon's modifier.The \"Extensive Modifier List\" version has: 7 rarities of modifiers (\"legendary\" - 1% - Orange, \"insane\" - 2% - Light Red, \"epic\" - 4% - Light Purple, \"great\" - 8% - Blue , \"good\" - 16% - Green, \"common\" - 40% - White, \"bad\" - 25% - Grey, \"sh*tty\" - 4% - Dark Red). You can identify which rarity a modifier is through the color of the item name in the tooltip.Both Melee and Ranged weapons can get modifiers.The name of the modifiers are more \"Terraria-like\", such as : Dexterous I, Murderous III, Hurtful II, Lucky V, Legendary... and many others.Many stats affected in various combinations.  The \"Realistic Modifiers List\" version has: 3 rarities of modifiers only(\"rare\" - 6% - Orange, \"good\" - 47% - Green, \"bad\" - 47% - Red) Only Melee Weapons can get modifiers. The name of the modifiers are more realistic, such as : Rusty, Sharpened, Well'Designed, Small, First Rate... Less variety in the stats affected, with less combinations. Multiplayer : It works in multiplayer. The bugged modifier names are no more.Compatibility : Should work with most mods that add weapons. (modded weapons will also get modifiers)Mods that modifies weapon tooltips may look weird. But it should be still fine.BRITA'S WEAPON PACK (and other such mods)Actions such as folding / unfolding stocks or changing magazine type is actually a recipe for crafting a new weapon, so it rerolls a modifier on the weapon. To avoid that : leave the sandbox setting \"Chance Multiplier on Crafted Ranged Weapons\" on 0, so the modifier is lost completely instead of rerolled.Don't like the balance ? Give me your suggestionsLeave your suggestions in the comments. If you want me to add a modifier ( or nerf/buff an existing one), just leave a comment and I'll see what I can do.Or... make your own. Modders can easily use the Weapon Modifiers Framework as requirement for their own mod. So, all they have to do is come up with a list of modifiers and rarities. Check the ModifiersDefinitions.lua file in the \"Extensive\" mod to see how to do it.Tinkering\"How to I tinker? The option is red for me!\"Read the magazine, or level up Maintenance and tinkering to 3.Then, get some tape or glue. And you should be able to tinker then.Tinkering SkillMore levels in Tinkering skill results in overall higher rarities on the modifiers of tinkered weapons, plus a chance not to consume items when tinkering (+3% per level)Maintenance and the appropriate weapon skill also slightly impact overall rarities. Much less than Tinkering though.Tinkerer TraitThe tinkerer trait costs 7 points and gives +1 Maintenance and +1 Tinkering. It also gives +20% chance not to consume items and has a slight impact on tinkered modifier rarities. And it gives the Tinker recipe so you don't have to read the magazine to be able to tinker.If you enable the sandbox option, the trait can be earned dynamically by reaching a sum of 8 levels in Maintenance and Tinkering skills, and having tinkered 15 modifiers of epic or higher rarity.Additionnally : The Repairman and the Engineer professions get +1 Tinkering skill. They still need to read the magazine to be able to tinker though.What is potentially coming in the future ? Build 42 compatibility update. Eventually.Credits:Many thanks to @Burryaga and @Вишня for their help with tooltip compatibility, and @MrAtomickDuck for lending me a server to test MultiPlayer.Workshop ID: 2932853467Mod ID: WeaponModifiersExtensiveMod ID: WeaponModifiersFrameworkMod ID: WeaponModifiersRealisticMod ID: WeaponModifiersReforge",

        "id": "2957935793",
        "url": "https://steamcommunity.com/sharedfiles/filedetails/?id=2957935793",
        "mod_id": "AnotherVehicleClaimSystemB41",
        "map_folder": "",
        "title": "Another Vehicle Claim System",
        "description": "Hello survivors, Another Vehicle Claim System (AVCS) is a vehicle ownership system designed for MP. Yes, there is indeed already a vehicle claim system feature in a mod called Valhalla Community but this mod works differently and is a complete standalone mod with no other features except vehicle ownership. This is primarily made for KWRR community server as I want a mod that do a particular thing and I don't need any other features.FeaturesOwnership trackingWe track ownership very differently from Valhalla mod, so differently that it is made possible to remotely revoke claims via UI while being on distant edge of the map.Location trackingWe tried really hard to find a way to track locations without putting much overhead on the server. This location tracking is not real time but good enough. It won't track vehicles that disappeared to the void.Actions probationsKWRR is a community server thus we do not want to prohibit positive community behaviors thus we block very specific behaviors with primarily intention to prevent your vehicles to be stolen or griefed:Uninstalling partsTaking engine partsDeflating tiresSiphoning gasEntering driver seatOpening (closed) trunkAttach or detach vehicleThat is to say we allow everyone toRepair partsRepair engineBe a passengerInflate tiresFull access for Safehouse or Faction membersDepending on sandbox settings, fellow safehouse or faction members will have full access to your vehicle which include the ability to unclaim them. AVCS is a simple personal vehicle ownership mod, not a comprehensive vehicle ownership which include separate system for faction and safehouse. As a middle ground, we simply provide the option at the discretion of server owners to allow fellow safehouse or faction members to have access to each other vehicles.Claim limitsThrough sandbox settings, you can set maximum number of vehicles one can claim.Mysterious Vehicle Claim OrbYou are require to have a claim orb item to claim vehicle. Depending on the server, it can be sold on server shop or be simply be crafted. This is intended to act both as a economy sink for server with shop system and prevent claiming abuse.Vehicle ownership timeoutThrough sandbox settings, you can set the number of hours owner have to be offline before vehicle automatically release itself.Related PatchesTsar's Common Library & AVCS Compatibility PatchCarWanna & AVCS Compatibility PatchVehicle Repair Overhaul & AVCS Compatibility PatchFAQWhat is the claim item id so I can add to my server shop?Base.AVCSClaimOrbCreditsFRIDAY#0612 (Discord) - For making the icons for UIPao#6042 (Discord) - For making initial UI which I then improved upontheleo - For Portuguese translationsSource Code - https://github.com/Lu5ck/AnotherVehicleClaimSystemMy Linux server scripts - https://github.com/Lu5ck/pzsvrtool[ko-fi.com][theindiestone.com]Workshop ID: 2957935793Mod ID: AnotherVehicleClaimSystemB41Mod ID: AnotherVehicleClaimSystemB41AddonContainersAccessMod ID: AnotherVehicleClaimSystemCraft",

        "description": "[KYR] Gaming Community – Real Weather ModPlease take the time to leave Feedback, Suggestions and Ratings  Support, News and Updates: For feedback, the latest news on updates, new mods, and upcoming features, please come and follow/support us:https://ko-fi.com/kyrgaming https://discord.gg/mRCBa9jHRq/ A huge amount of time and care goes into our mods and we’re very receptive on feedback and bug reports. If you’ve found something that doesn’t make you smile, please give us a shout!------------------------------------------------------------------------------------------------------ Mod Summary This Mod brings some slightly challenging and more lifelike feel to the in-game weather systems. This will bring extremely hot summers (topping 100). This gives fatigue affects if temperatures aren’t managed correctly.Winter will also drop well into sub-zero temperatures, meaning you’ll need to deal with the environment like never before!As always, our mods will make things slightly more challenging. We’re extremely careful to always keep things balanced and in tune with the base game though.WARNING: We have NOT tested values at the extreme ends of the available scales. If you insist on changing the settings to options this extreme, we are unable to advise on the effects this may have on your world and characters!------------------------------------------------------------------------------------------------------ LATEST UPDATES  – v4.0.0 - 07/01/25This mod now fully supports B42This mod WILL STILL work with B41FULL customization of WeatherWe’ve left the default settings as they were, tweak for you preference!v3.1.1 - 15/09/24Latitude Cap Introduced at 65 (Thank You Community Feedback!)v3.1.0 - 23/06/24More Frequent Update Calls For Weather Added – Variable changes now fully working and take affect quicker!(Single-Player - on game load)(Multi-Player - once a month)Higher Default Max Temp Set (35 instead of 30)Lower Latitude Value (40 instead of 41)Variable Caching Bug Fixedv3.0.0 – 25/04/24Complete File Renaming Overhaul!We Noticed some files in our own Modlists we’re conflicting. As part of some large re-writes going on at the moment, we’ve rolled out a new naming convention across all our mods. This should eliminate some edge case errors and pave the way for the new content.v2.2 – 19/01/2024Min Temp to -170 Degrees for Cryo Enjoyers!Max Season Variation increased to 40v2.1SANDBOX OPTIONS EXPANDED!Default Latitude Tweaked Slightlyv2.0SANDBOX OPTIONS ADDED!v1.1 – 16/10/023BUG FIX! – (Code Typo)v1.0 - 15/10/23 Launched!  COMING SOON! Not Sure!------------------------------------------------------------------------------------------------------ Main Features Weather, Daylight and Temp Changes This Mod will bring:-       Full Weather CustomisationBy Default:-\tWarmer Summers -\tColder Winters-\tMore variation in Season temperature-\tMore variation in Daylight hours (longer summer days, longer winter nights)------------------------------------------------------------------------------------------------------ Mod Options Latitude Variation – This will control the position in latitude of your Game World on the Real World. We have set this slightly higher than the default to give a more accurate reading for KY and hence more accurate weather. Adjust this as you wish, further North (higher value) will result in Milder Summers, Colder Winters, shorter summer nights etc.Max Temp – This will control the Maximum Temperature you’re Game World can reach.Min Temp – This will control the Minimum Temperature you’re Game World can reach.Season Variation – This will control the variation in Seasons between years. So think along the lines of 1993 mild summer, wet winter etc., higher value means more variation. We recommend 9 here to accurately reflect some of the insane Weather changes witnessed at speed in KY. Increase further at your own risk.--------------------------------------------------------------------------------------------- ommunity ------------------------------------------------------------------------------------------------------ Workshop Details Workshop ID: 3051276857Mod ID: KYRRealWeatherMod",

        "title": "ExtraNoise's Flag Tiles",
        "description": "This flag pack adds 500 new flags that can be hung up on the walls around your house or base. Each flag comes in two sizes, large (three tiles wide) and small (one tile wide, hanging vertically). The flags have all been painstakingly designed to look like the game's original flags.Multiplayer server admins can spawn the flags using the names provided in the screenshots. As a point of note, all flags in this pack begin with the prefix \"ENF\" (ExtraNoise's Flags) followed by the flag name. Small flags include the suffix \"Small\". These are great for adding character to servers whose players might want to establish boundaries for their faction or other player representation.Included FlagsIncluded in this pack are: National flags (unfortunately not all nations are included, but it is a vast majority), European regional flags, Canadian provincial flags, US state flags, historical flags, independence movement flags, fictional flags from media, US national and international organization flags, various protest flags, pride flags, a collection random flags and banners, some handwritten \"flags\" using bedsheets for flavor and base labeling, and a selection of flags that are my favorites from reddit's r/vexillology subreddit.Now Craftable!I appreciate everyone's patience as I worked diligently to make each of the flags in the pack craftable--at almost 50,000 lines of code!--so that players can now make them in the game without having to rely on multiplayer server admins to spawn them in (helpful if you are not playing a multiplayer server, as you can imagine). In order to make them, you will need to first craft a blank flag using sheets, scissors, a needle or sewing kit, and thread. Once a blank flag has been crafted, you will need a paintbrush and paint buckets to paint the flag. It's not an elegant solution, but it is designed to keep your context menus simple instead of trying to list out 500 options when you accidentally right-click a sheet in your inventory.A warning:Paint cans are heavy! I've updated the recipes so that flags can be crafted from paint cans on floors or shelves. You can also have the paint cans on you, but being overloaded can cause injury.Good luck and don't say I didn't warn you.Regular PlayersYou need to subscribe to this mod if you've downloaded a map that makes use of the tiles in this pack or a multiplayer server has been configured to use them. You don't have to enable the crafting sub-mod included unless you want to use it or the multiplayer server you're on uses it.Map MakersYou can download the raw tiles (with instructions on how to use them) here: https://www.dropbox.com/s/n6c9q4xu6gjz4zt/en_flags.zip?dl=0A Note on DiscretionFlags are one of those things that are often considered benign and inoffensive... until they aren't. Included in this pack are a number of flags that have a sordid history. For example, even the United States flag could fall into this category for some people. That being said, where contentions arise I have chosen to use the current flag for any given nation/region instead of the 1993 version (which some flags use) based on the in-game start date. A good example of this is the inclusion of the 2021 Mississippi flag instead of its predecessor. This is purely up to my own choice and may be changed in future releases of this pack. I have chosen to omit a number of incredibly divisive or incendiary flags, such as those used by hate groups in the modern day. I will absolutely not entertain the idea of including these flags in future releases, so please do not ask.Anyone is free to modify the content of this pack as they need for their map/server.Take a look at my other mods! Where I hang out & post updates[discord.gg]Workshop ID: 2784607980Mod ID: EN_FlagsMod ID: EN_Flags_Craft",

        "description": "Hello! With this mod you can build walls, roofs, doors, fences and curbs for imitation of a greenhouse. No special greenhouse features or any farming affection added.17.01.2024 changed requirements for walls and recipe for glass panel. If you use Improvised Glass Mod you will see only requirements for walls changed25.09.2023Updated the mod with glass panels from Improvised Glass mod by Orc. I imported them in cut version: only panels and their craft recipes.These panels are now required to build glass walls and roofs. They can be found in \"Random Junk Crates\" or can be made by smelting broken glass in roasting pan in any stove or grill. Improvised Glass mod isn't necessary for Greenhouses to workNOTE! If you use Improvised Glass mod make sure that it would be loaded AFTER my mod!Details:Can be found under Carpentry menu.4 main colors: white, brown, green and black. Flat roofs are required to make your greenhouse count as \"indoors\" an be rainproof. First place flat roofs and then ordinary ones. There are 2 levels of flat roofs, you need lower one for 'sealing' the house. All roofs should be placed from the second floor, not from the ground.There are fences and curbs to separate your plants from other tiles. Fences need to be placed before digging a furrow, curbs - after. In other way you will get ugly tile overlapping.Based on More Builds code, doesn't conflict with it.ABOUT MODPACKS and other usage: do whatever you want, just credit original mod in description. If you edit my mod or add it to modpack pls change Mod ID, so users will have no conflicts in future in case of any updates. Addon for Building Menu: https://steamcommunity.com/sharedfiles/filedetails/?id=3244396311Workshop ID: 3035031408Mod ID: Greenhouse",

        "title": "Raven Сreek",
        "description": "This adds the port city of Raven Creek to the vanilla game world.______________________WARNING! READ ALL BEFORE DOWNLOAD!BY SUBSCRIBING TO THIS MOD, YOU CONFIRM THAT YOU HAVE FULLY READ THE DESCRIPTION, AND YOU HAVE NO PROBLEMS WITH IT.FOR VERSION 41.71What you need to know:After EACH update for avoid bugs, you MUST start a new game. Sad but true.You need to turn this option OFF in sandbox (Randomized house chance - set never)Turn ON in the game settings (Double-sized textures: Yes)  There are three zones of various difficulty on the map. They have a different spawn number of infected, and other features. This map may be too hard for some people, it is not designed for beginners. Some spawn points can be very difficult, others easy. It depends on your luck. Sometimes you may appear surrounded by zombies.  Still do not forget that you personally adjust the difficulty of the game in the sandbox, if it seems to you that the map is too hard or easy, then change your own settings.  This mod does NOT conflicts with Fort Redstone. But mod conflicts with the All-In Zomboid Map Pack (AIZ), New Denver (Slocan Lake) and every other map mod that replaces the same game cells (see last screenshot).  There is a lot of loot on the map. The map was created to gain a different experience from vanilla, where there will be more action, and where there will be a lot of everything - from infected to weapons. The city was planned for fast raids with friends (or solo), and not to establish a base here.How do I get in from the standard map? Straight west from Rosewood(upper left corner on the PZ map) until you see a road sign indicating the city.You will need a sledgehammer to get out of townUnfortunately, the text in the description is limited, click on the link below to read the description in full. (Learn about zones, download the map in HD, and get more details about the map)https://theindiestone.com/forums/index.php?/topic/27752-raven-creek/ If you like the mod, don't forget support it. Thanks and enjoy the map.________________________Этот мод добавляет портовый город Raven Creek на стандартную карту разработчиков.ВНИМАНИЕ! ПРОЧИТАЙТЕ ВСЕ ПЕРЕД СКАЧИВАНИЕМ! ПОДПИСЫВАЯСЬ НА ЭТОТ МОД, ВЫ ПОДТВЕРЖДАЕТЕ, ЧТО ПОЛНОСТЬЮ ОЗНАКОМИЛИСЬ С ОПИСАНИЕМ, И У ВАС НЕ ВОЗНИКЛО ПРОБЛЕМ С ЭТИМДЛЯ ВЕРСИИ 41.71Что нужно знать:После КАЖДОГО обновления во избежание багов нужно начинать новую игру.ВЫКЛЮЧИТЕ эту опцию в песочнице - Шанс найти убежище: выберите НикогдаВКЛЮЧИТЕ двойной размер текстур в настроиках игры.   На карте есть три зоны различной сложности. В них разное кол-во зомби и другие особенности. Эта карта может оказаться слишком сложной для некоторых людей, она не предназначена для новичков. Некоторые точки спавна могут быть очень сложными, другие - легкими. Это зависит от вашей удачи. Иногда вы можете оказаться в окружении зомби.  Тем не менее, не забывайте что сложность игры вы лично настраиваете в песочнице, если вам кажется что карта слишком сложная или простая, значит измените свои настройки.  Этот мод НЕ конфликтует с Fort Redstone. Но мод конфликтует с All-In Zomboid Map Pack, New Denver и всеми остальными модификациями карт, которые заменяют те же игровые ячейки (см. Последний снимок экрана).  На карте много лута. Карта создана для получения иного типа опыта, где будет больше действий и изобилие всего - от зомби до оружия. Город был спланирован для быстрых рейдов с друзьями (или в одиночку), а не для создания здесь базы.Как попасть в город со стандартной карты? Идите прямо на запад от Роузвуда (верхний левый угол на карте PZ), пока не увидите дорожный знак, указывающий на город.Вам нужна кувалда чтобы покинуть город  К сожалению, текст в описании ограничен лимитом, нажмите на ссылку ниже, чтобы прочитать описание полностью. (Узнать о зонах, скачать карту в HD и получить более подробную информацию о карте) https://theindiestone.com/forums/index.php?/topic/27752-raven-creek/ Если вам понравился мод, то не забудьте лайкнуть его.Спасибо и надеюсь вам понравится.Workshop ID: 2196102849Mod ID: RavenCreekMap Folder: RavenCreek",

o's More Street Details: https://steamcommunity.com/sharedfiles/filedetails/?id=2554699200  -throttlekitty's tiles: https://steamcommunity.com/sharedfiles/filedetails/?id=2384329562&searchtext=tkTiles_01If you have issues, remember:-As with other maps mods, if you visited the adyacent cells, the map may not appear, if that happens you need to start a new game. (this includes early version of the mod)**PUT TRIMBLECOUNTYPOWERSTATION FIRST ON MAP ORDER JUST ABOVE MULDRAUGH,KY***(only for servers, check pictures to see how to do it)In server settings if you have trimblecountypowerstation spawn region, unsub and delete the mod folder then resub, if you still see it remove it from spawn regions on server settings. you may also need to delete and redownload the mod on the server.Future plans:-Map is finished, maybe ill add something more, but i have to think about it.But.. there is no spawn points there, what a *******:This map is located outside of the \"Lore\" Blockage (which i tried to recreate) so i wanted you to take some time to reach there and arrive when there are only zombies left.Uses these cells and will not be compatible with any mod that modifies these cells:50x10,50x11,50x12,50x13,51x10,51x11,51x12,51x13,52x10,52x11,52x12,52x13,53x10,53x11,53x12,53x13,54x10,54x11,54x12,54x13,55x10,55x11,55x12,55x13,56x10,56x11,56x12,56x13,57x10,57x11,57x12,57x13,58x10,58x11,58x12,58x13,59x10,59x11,59x12,59x13,60x10,60x11,60x12,60x13,61x10,61x11,61x12,61x13,62x10,62x11,62x12,62x13Want to know where is everything? Project  Zomboid Maps did a online map for this: (it has custom tiles don't show on it but it works fine)https://pzfans.com/project-zomboid-maps/?map_name=Trimble_County_Power_Station_La_Grangeknown incompatible maps-Lexington map-Luisville Military Base #1-The Sims Zomboid-Shelbyville, KY Issues loading the .pack files?or maybe need a full deletion of the mod?Un-sub from the mod, go to the 108600 folder in Steam\\steamapps\\workshop\\content\\ and delete 2802755864 if stills there, then resub to the mod.Lags on some parts of the mapmay lag a little for maybe 10 secs near the farms as it needs to load the harvestable plants, it stops when they are loaded. (usually happens using Snake mod pack or mods that alter agriculture)Messed up tiles Enable double sized textures as this map is done with 2x tiles.Thanks to the creators of the community buildings.Also thanks to RingoD123 on the forums for the tutorials on mapping.Thanks to Daddy Dirkie Dirk,Fantasiado,欧金金,throttlekitty,SleepWell,|wDe| Gernhart Reinholzen and MissRaptor for their tiles, awsome work! :)Constructive criticism & suggestions  are welcomed.Before downvoting by issues make sure its this mod fault and not other mod's fault. thanksDo not Modify/reupload on workshop or anywhere else without permission. (you can ask me on comments or by PM)Support me on:https://ko-fi.com/asierus24Workshop ID: 2802755864Mod ID: TrimbleCountyPowerStationMap Folder: TrimbleCountyPowerStation",

        "description": "A small town called Ashenwood.The town grew fast as people wanted to settle somewhere outside of the city but still have all the service and entertainment of the big cities. More and more houses popped up as well as a few small businesses that decided to try their luck in this little town. The growth of AshenWood was well underway when people started hearing about the outbreak. Most people grabbed what they could carry and tried to make it out, leaving everything else behind, causing the growth of the town to halt just as fast as it had started. A few tough people however, decided to stand their ground and fortify what they could in an attempt to fight off whatever this virus would bring with it. For bugs being fixed in a future update, please check https://steamcommunity.com/workshop/filedetails/discussion/2820363371/3421060714402040961/ Most of the buildings are custom made for this map.Some of the map features:- Residental houses.- Apartments.- Cabins.- Survivor hideouts.- Entertainment.- Gas stations.- Storage Units.- Grocery stores.- Tools and farming stores.- School.- Church.- Construction sites.- Gun store.- Police station.- Medical, doctor and pharmacy.- Fire station. - Auto shop.- Resturants and bars.- Lots of water for fishing.- Car spawns.- Trees and foraging zones.And lots of little secrets for you to find on your own! BEWARE , This map includes buildings with lots of tricky corners and cramped spaces, watch your step! Bikes, junkpiles, decor items and trash, can be picked up and moved, or destroyed with sledgehammer. Conflicts with other map mods that uses the same cells (38,38 - 38,37)If the map isnt there in your game, you have to start a new run. This is my first map mod, let me know what you think, good or bad :)Dont forget to rate and favorite! Workshop ID: 2820363371Mod ID: AshenwoodMap Folder: Ashenwood",

        "id": "2840889213",

        "map_folder": "Chestown",
        "title": "Chestown",
        "description": "Welcome to Chestown, KY This town sits on the western part of the Exclusion Zone, south of Riverside. Tall apartment buildings and wealthy suburbs await you, however be wary of its narrow alleyways and even narrower staircases, death will await you at every turn so be cautious with every step you take.Pas mal non ? C'est français.Cell occupied (15,22)This map conflicts with Wildberries, pick one of the two. Some answers to frequently asked questions: - (As of 03/05/24) Despite the many comments, this map works in multiplayer like any other up to date map and is set up like any other map, 100% of issues with Chestown not working in multiplayer are user side and not the fault of the mod itself, as evidenced by the 10s of thousands of people using it in multiplayer.- Has a police station, multiple medical POIs, a pawn shop, a hardware store and a library, doesn't have a school, fire station, gun store or warehouses. The map will never be made bigger and will never have new buildings (school, bigger suburbs, etc.). Will  maybe  have basements once B42 comes out.- Loot and vehicle zones all work fine and as expected, meaning that loot does spawn (and respawns according to your sandbox settings) as do cars.- Zombie density is tied to the size/height of a building and mappers cannot change that, meaning that despite its small size, Chestown will always have a ton of zombies because of its many tall and dense buildings.- Loot density: Same thing, tall and dense buildings mean lots of rooms to explore and lots of loot to get, if you think that's game breaking you should not play with this map.- Too many guns: I don't know what causes this for some people. My playtests were fine. Sometimes it's added mods that mess up loot tables, sometimes it's the game itself that spawns too many guns in rooms that are connected to one another if one room is supposed to have a higher chance of spawning guns than others. If that's the case I can't do anything about it. I suspect it is more obvious in Chestown than in the vanilla map (or other modded maps) since a lot of buildings are connected to each other.I will leave the older comments but going forward I will be deleting any new comments about these specific topics I just covered.This map is considered finished and will not be updated further (save gamebreaking updates). You may add it to a mod pack  for private use, such as multiplayer servers.  This mod pack must be used and shared privately for you and your community and must not be shared publicly on the steam workshop or anywhere else.Workshop ID: 2840889213Mod ID: ChestownMap Folder: Chestown",

        "description": "And you notice something in the distance, although sweat and exhaustion make you believe it's an illusion... Damn! Too many zombies are coming... Maybe you survived, maybe you were bitten, maybe you died, however you managed to see that it wasn't an illusion, an unknown city lies in front of you, you wonder if it's worth taking the risk and ransacking the place a bit, at In the end you still need to find a place to sleep and something to eat. She had to take a risk.On this map you will find a bit of everything, some food, some tools, some weapons and, who knows, maybe the odd generator.Cell 25:34Incompatible Map Mods:- Base BBS/ WORK IN PROGRESS /Map in beta phase, it can change in the future, both location and building itself.Y notas algo a la distancia, aunque el sudor y el cansancio te hacen creer que es una ilusión... Joder! Se acercan demasiados zombies... Quizás sobreviviste, quizás te mordieron, quizás moriste, como sea lograste ver que no era una ilusión, una ciudad desconocida yace frente a ti, te preguntas si valdrá la pena arriesgarse y saquear un poco el lugar, al final de todas maneras necesitas encontrar un lugar donde dormir y algo para comer. Tocó arriesgarse.En este mapa encontrarás de todo un poco, algo de comida, algo de herramientas, un poco de armas y, quién sabe, a lo mejor algún que otro generador.Celda 25:34Mods de mapas incompatibles:- Base BBS/ TRABAJO EN PROGRESO / Mapa en fase beta, puede cambiar en un futuro, tanto ubicación como edificio mismo.If you liked the mod and would like to cooperate and/or order a modification/map you can contact me through Patreon:patreon.com/RoddoWorkshop ID: 3014975675Mod ID: WellsburgMap Folder: Wellsburg Lake",

        "description": "I like gated communities. So I made a mod that adds one to the north side of West Point, right by the river.It includes 6 houses/mansions of variable sizes. Some looking richer than others.A baitshop has also been added nearby.IngameMap is done. Foraging Zones are done. Zombie Zones are done.The Spawn Points include houses inside the Gated Comuunity as well as house located right beside the community's fences. There's also a secret hidden somewhere. Can you find it ? CompatibilityThe cell used is 39x22.I haven't found an other map that uses this cell. If you do, share it in the comments.Compatible with:Over The RiverWest Point ExpansionWest Point Fire DepartmentWest Point LighthouseWest Point Trailer Park & VHS StoreWest Point Suburbs and FarmDo you like this? Try my other maps : West Point Trailer Park & VHS Store : It adds a VHS store south of West Point since it's missing one. Rosewood VHS and Gun Stores : It adds a VHS Store and a Gun Store south of Rosewood since it's missing both of them.\"We want to use this map in a mod pack, do we have permission ?\"Yes, as long as it's a private mod pack.\"Can I add this midgame ?\"If you haven't visited that part of West Point in your saved game, yes.For Multiplayer: instructions given by a comment :How to get the mod to work:1. Go to the \"Map\" section of sandbox settings.2. Choose the map (\"West Point Gated Community\") from the dropdown menu under \"Add an available map to the list\".3. Click on \"Muldraugh, KY\" in the \"Maps used by this server\" box and click \"Move down\" until it's at the bottom of the list.B42 version when ?When the mapping tools are updated by the devs.Workshop ID: 3025055056Mod ID: WestPointGatedCommunityMap Folder: WestPointGatedCommunity",

        "title": "Tikitown (B41/B42)",
        "description": "Welcome to Tikitown!Rediscover Tikitown in Build 42 – a thriving oasis nestled between Riverside and West Point! Whether you're a survivor seeking refuge or a thrill-seeker looking for fresh challenges, this vibrant town has it all. Wander through its charming old-town streets, scavenge the bustling downtown district, or find shelter in its unique and customized residential quarters. From hidden secrets to strategic strongholds, Tikitown offers a unique mix of nostalgia and survival in the heart of the apocalypse. Will you make it your home, or will it be just another stop on your journey?With the Mortar & Moans expansion, Tikitown brings you a whole new experience, even to those of you familiar with Tikitown from B41.🔥 What’s New in Tikitown? A Complete Urban Overhaul! 🔥• 🚧 Downtown Revamp: Experience a fully redesigned downtown, teeming with new hotspots and hidden dangers.  • 🚆 Railroad Integration: A fully integrated commuter rail, plus a massive warehouse, railyard, and docklands to explore and loot.  • 🛡️ Blackshields PD: A heavily fortified police department themed around the enigmatic Blackshields • 🏢 FBI Field Office: A brand-new federal headquarters with secrets, security, and maybe some high-value loot inside?  • 🏈 Tikitown University Opens Its Gates: A sprawling new campus, featuring an authentic to-scale American football field—will it host survival drills or something more sinister?  • 🏡 Expansion of Mansion Row: More lavish estates to explore, fortify, or plunder. The wealthy didn’t take it with them… did they?  • 🔦 New Underground Areas: Navigate tunnels, parking garages, and more; perfect for ambushes, escapes, or eerie encounters.  • 🏗️ Industrial Sector Overhaul: The industrial area expansion has begun with new landmarks, businesses, and hidden dangers ready to discover.• 🚢 Expanded Docks: The docks have been reimagined with a full Port Authority and an expanded Northside docks area; trade, survival, and secrets now await!Will you claim Tikitown as your own, or will it claim you?Tikitown in B41 requires the following tilepacks Melos TilesDaddy Dirkie's TilesNewburbsDrazion's TilepackB41 Tikitown sits on the following cells23,2323,2423,2524,2324,2424,2525,2325,24We've been hard at work bringing you an even bigger, better Tikitown, and we’re just getting started! We’re thrilled to welcome new creators Reaver and Seinne to the team—both have been instrumental in taking this project to the next level.If you thought Tikitown was already exciting, get ready for what's coming next! Here’s a sneak peek of the upcoming updates:• 🏗️ Industrial Sector Overhaul:  We’re pushing forward with the complete expansion of the industrial area, adding new landmarks, businesses, and hidden dangers.• 🏙️ High-Rise Overhaul: The city’s skyline is about to change! We’re upgrading the high-rise district, integrating the new FD, PD, and FBI Office for smoother urban flow and exciting new locations to explore.• 🚇 More Underground Expansions: Tikitown’s underground maze will continue to connect more key areas, creating new escape routes, hidden paths, and new places to explore beneath the city’s surface.• 🏡 Residential Expansion: A brand new, customized single-family home area with unique, player-friendly designs that add more variety and depth to Tikitown’s residential life.We can’t wait for you to experience the next chapter of Tikitown. The best is yet to come!CN TranslationWorkshop ID: 3037854728Mod ID: tikitownMap Folder: Tikitown",

        "title": "New Albany",
        "description": "Welcome to New Albany!This map adds 33 cells of area across the river to the north of Louisville and is loosely based on the real world city of New Albany that would be found in that same areaThe map was originally created and used exclusively on the Wasteland RP server for their 4th Season in early 2024. This served as a great test run and provided a lot of feedback on tile issues, balance, zoning, and other general mapping related bugs. This obviously doesn’t mean it is perfect though! This was my very first mapping project so if there are any issues found please do leave a message in the Bugs discussion!There are a handful of custom buildings based on interesting IRL structures I was able to find searching around New Albany along with contributions to the custom building pool from Tesco and macsmp.Being my first project and being on a bit of a time crunch, I couldn’t commit the time to making 100% of the buildings from scratch so used a some vanilla buildings, as well as ones provided by Blackbeard in the Building Pool V3 mod in which they gathered a large collection of pre-made structures contributed by 30+ map modders.So for that, thank you Blackbeard and all the contributing modders!Atoxwarrior, BeastlyBean, Blackbeard06, cmseter, DavidBlane, dko112, DoctahWong, Doublebrain, chinotauku, fluffe9911, GothicGhost, grivcin, Jela331, kaizokuroof, Kennethdio, Leolvanov, mads232, Mainulainen, Neutralnz1, Project Zomboid's Dev team, rsdworker, Sieben, srandiny, The googlator, Traya Aclus, Valindil, Veged, VikiDikRUS, Way2sp00ky, Z3759xy, IndigoRebel, zoeyflower, and all the rest!Thank you also to all the Wasteland Server community members and staff for being my guinea pigs and provided testing and feedbackI suppose I should also thank the crazy northern fool, TescoValuePlums who jumped into the mapping deep end with me (got dragged in) and kept me sane throughout the build processNEVER FORGET THE ZOOOONES!!!Other points to note:There are many tile dependencies for this mod so ensure you have them all or you’ll end up with missing texturesThis map will work in MP servers so please feel free to use itThere are very few other map mods that occupy these same cells so conflicts should be minimal (I’ll make a list of conflicting mods as they are found)This map does have its own spawn points linked to various (vanilla) professionsThe map can be accessed (or exited) via the bridge in the north west of LVThere is a lootable map for this region that will spawn in all the normal map spawn locationsEnjoy!UI sounds provided by ZapSplatWorkshop ID: 3345235753Mod ID: NewAlbanyMap Folder: NewAlbany",

        "description": "Want a FUN and REALISTIC zombie outfit distribution mod? This mod is for you! This mod adds a variety of zones into the game which gives zombies outfits to match their surroundings.It also adds over 150 custom outfits which are appropriately placed on zombies in the world. YES The mod is compatible with Build 42!  Goals of this mod:   Add the unused zombie outfits that the Indie Stone developers made  Add iconic George Romero-esque zombie outfits (Zombies hold items in their hands!)  Add appropriate setting and rarity for their clothing and items.Here are some of the main features of Authentic Z.    Fat Zombies!   Zombies with missing arms and hands!   Backpack attachments. Upgrade your bags through 3 tiers to add more attachment slots!   Adds a new custom costume shop in Louisville. You will find lots of fun clothing and accessories in there.   The Crossroads Mall spawn zombies with random outfits = Random FUN!   The March Ridge Dormitory is rezoned to have unique zombie placement within it.   Ice Cream workers at each Ice Cream shop. Same thing with the new Donut Shops.   Dedicated spawns for Hazmat zombies, Service Uniform zombies, and Ghillie Suit zombies at the Secret Base   The large campgrounds, southwest from Riverside, are rezoned into Friday the 13th's Camp Crystal Lake. Find Jason, before he finds you! Includes other slashers like Michael Myers, Freddy Kreuger, and Leather Face!   Student and Varsity zombies at schools have been fixed to only have realistic hairstyles.   Fisherman and Poncho zombies alongside lakes and rivers (If zombies spawn there)   Hunter Zombies chance at isolated cabins and hunting stands.   Zombified Heroes from all your favorite zombie media   Famous Zombies from the zombie genre   Clown zombies…...Yes…...Clown Zombies  and a nice hit-list with checkboxes so you can log your progress! Great for late-game content!  Supported Translations -  Always looking for more translators! Want to help? Contact me!    Chinese (Traditional and Simplified)  French  German  Polish  Portuguese (From Portugal and Brazil)  Russian  Spanish  Future Plans    If you want to keep up to date with the current progress and future plans, check out the official Trello page for the mod!  [trello.com] The 3 Branches - Only use ONE  AuthenticZ - Current has all the features.   AuthenticZLite ONLY has the outfits and zombie spawns. It does NOT have the backpack upgrading system.   AuthenticZBackpacks+ ONLY has the backpack upgrading system.   Common Issues and their fixes 1. \"My server won't start\" \"Normal Termination\" etc etc  FIX - Update your copy of AuthenticZ, sometimes Steam doesn't do it correctly. Review Method 2 on updating mods for servers/local servers  [theindiestone.com]2.  \"I can't upgrade my backpack or use the attachment slots\" etc etc FIX - Make sure you are NOT running multiple branches of AuthenticZ, this is a common issue of doing that. Make sure you have the sufficient materials to upgrade. Secondary bags (small bags that you can not wear on your back) need a carabiner (can be crafted with 5 paperclips) so it can be attached to the \"Secondary Bag Slot\".  Want some fun companion mods? Try These!     [discord.gg][www.patreon.com][ko-fi.com]I hope you enjoy and have lots of fun.AuthenticPeachI do not give you permission to use the AuthenticZ assets for anything outside of gameplay functionality, unless specially given by me. My assets are considered Steam workshop items and can not be used to create NFTs. NFTs violate Steam TOS. Please do not re-upload my mod without my specific permission. I have the means and motivation to go after such violators. YES The mod is compatible with Build 42!   YES This mod is SAFE to add mid-save!   Please read the Q&As before posting in the comment section.  Common Q&As    Compatible/Incompatible Mods list    For Server Owners and Admins   Complete list of Item IDs (If ever needed) (currently outdated, will update later)  When you report a bug, give me as much info as you can. Such as...1. What branch of the mod you are running, 2. When does the error happen (so I can replicate it) 3. Any console error reports. For the best convenience and response time, post your error report on my discord channel, linked above.Also try uninstalling and reinstalling the mod if you suspect that your copy of the mod wasn't updated when one was released recently. Steam sometimes doesn't immediately push updates.Workshop ID: 2335368829Mod ID: AuthenticZBackpacks+Mod ID: Authentic Z - CurrentMod ID: AuthenticZLiteMap Folder: AZSpawnMap Folder: AZSpawn",

        "description": "This mod will add for almost all hats new adjusted hair models for the default hairs to keep their original shape when wearing something on the head. No more Ponytails or flat hairs!You can still turn your hair into ponytail if you wish so.(Also i improved the Ponytail(Braided) a bit to make it look more fluffy!)Credits to \"Chuckleberry Finn\" to help me out with the LUA part to hide the new hair-styles in the character creation menu so you don't accidentally pick the wrong ones! [At the Old mod version of it in 41.50]Check out his other mods:   Chuckleberry Finn's workshop I need you!Please give feedback if you found a bug or glitching vanilla hair like so  :[Gender] -  [Hairstyle] - [Hat][Additional Info]Since there are alot of different Hair/Hat combinations i have not tested every single possible combination.But i will write down every feedback for issues or improvements and will work through them until this mod is somewhat perfect!(Please add Feedback in the discussion thread) FAQ:Is \"Fluffy Hair\" compatible with  \"Spongie's Hair Pack\" ,  \"Yaki's Hair Salon\"  and  \"Harry's Hair\"  ?I gave it a test and it seems work great together.They also took care of making their hairs working properly with hats.At Harry's Hair the alternative hat-hairs do show up in the hair menus for some reason. I want to make a hat/hair compatible with your mod, how do i do?Just Set the Hat-Category or the hair groups like that:- Group01 If its a normal hat (CowboyHat, Tinfoil, Beany)- Group02 If its a band (Bandana, Visor, Bandage)- Group03 If its a hoodie- Group04 If its over-ear (Winterhat, bicycle helmet)- Group05 If its just default hair if you dont want any alternative hair- Group06 If your hairs are fully covered (Shower caps, Surgeon caps)- Group07 If its the default HatHair StyleWill this mod work with a existing savegame?Yes Which game version works with this mod?I have tested it with game version B41 and B42 and Hosted Multiplayer Is this mod compatible with other Mods?This Mod will not be compatible with mods which do:- Change default hat items- Change default hair stylesMods which add completly new hairs should be compatible.Am i allowed to use this mod in a Server mod pack?Yes[ko-fi.com]Workshop ID: 2447729538Mod ID: FH",

        "title": "Undead Survivor",
        "description": "This mod adds currently 5 new outfits which only spawn on zombies!More to come time to time  Features:- Outfits will spawn on zombies, this is the only way you can find them- You can tuck the trousers into your shoes- Hood up and Hood down features for hoodies- All objects have proper ground objects when placed down- Male and female compatible- Blood, dirt and holes appear on the right spots- And more individual features on certain outfits!The Stalker is geared for getting in close combat and situations where you have to be light and agile. If you are lucky and find his knife, then you cannot be better prepared for any melee encounter. Only downside is that due to its lightweight tailoring, the outfit does not withstand very cold and rainy weather. Stalker Mask (Does not spawn always) Stalker Cloak Stalker Jacket Stalker Trousers Stalker Gloves (Does not spawn always) Stalker Boots Stalker Knife (Does not spawn always) The Nomad has the perfect outfit to hike through the lone wilderness in the cold and rainy weather. They aren't fighters; their outfit will slow you down and doesn't have the best protection against the dead, but if you are lucky, you can spot one with a backpack which can hold all your equipment if you are strong enough to carry it. Nomad Mask Nomad Parka Nomad Trousers Nomad Boots Nomad Backpack (Does not spawn always)The Prepper, aka. Gear-junkie, isn't best suited for infectious bites. His strategy is to keep death 10 feet away. To make sure he doesn't run out of ammo, he's equipped with gun magazine pouches and small, but efficient bags which can be mounted to the vest as some sort of backpack. If the walking dead gets too close, he has a small knife attached to his vest and can retrieve it by a quick hand, in addition to a flashlight. Prepper Helmet Prepper Gasmask Prepper Jacket Prepper Trousers Prepper Flashlight (Can be attached to the vest) Prepper Knife (Can be switched between stab and swing attacks which have slightly different stats) Prepper Vest (Can be combined with bags) Prepper Vest with Bags (Does not spawn always) Prepper Bags (Does not spawn always) Like a stoic stone from a distance, the Headhunter observes and waits for his victims to appear. His gasmask and long mantle covers him from hazard rains and the storm while doing so.The customized rifle is heavy and slow, but a deadly and reliable weapon with 20 bullets and a range you haven't seen before. No victim can escape once spotted. Headhunter Gasmask Headhunter Mantle Headhunter Backpack (Does not spawn always) Headhunter Rifle (Does not spawn always) Headhunter Scope(Does not spawn always)A team of women who retain their beauty in dark times and still strong enough to survive. Their self-made clothing can be deceiving; a dress and cloak made of thick fabric and fur gives good protection from bites and keeps them warm. In addition, they also have a hip bag that keeps them light and flexible. Their spear is an effective weapon and tool for hunting or fishing. Amazona Cloak Amazona Dress Amazona Hip Bag (Does not spawn always) ---> Double click to equip <--- Amazona Boots Amazona Spear (Does not spawn always) Amazona Makeup (Always available) And some more Extras Credits to  Vilespring  for a more elegant and non-destructive attachments code!Credits to  Authentic Peach  for alot of help with attachments and other stuff and his mod  AuthenticZ which i used for many things as template! Thanks!Credits to  「Arko Piktuviry」  and  Siowar  for creating the spanish translation! And Lordben-wan for the Portugal and Hea for the russian! Thanks!Thanks to  UdderlyEvelyn   and Konijima for being helpful! FAQ: Any Actively supported Mods? \"Udderly Attachmnents\":Its a framework to make it easy for modders to share custom attachments with each others weapons.\"FirearmsB41\"It adds more Firearm stuff and changes some behavoirs.For example you keep your weapon in your hand after adding/removing attachments.Will this mod work with a existing savegame? YesWhich game version works with this mod? I have tested it with game version 41.78Also it does work in MPHair Pokes through the hoodiesMake sure that you have installed the mod \"Fluffy hair\".If you have Fluffy Hair installed and the Vanilla hair still pokes through then please report like so:\"Gender - Outfit - Hairstyle\"I cannot find your Outfit / The Outfits are too rareThe Outfit is indeed very rare. Its hard to say how much the chance is exactly.But i have seen a few of them after a few minutes of running around in a city with zombie count on \"insane\".In your sandbox settings you can set the relative chances under the \"Undead Survivor\" Page.Am i allowed to use this mod in a Server mod pack?YesWhat outfits will come next? Sometimes i post in my \"kofi\" stuff i am working on.[ko-fi.com]Workshop ID: 2713921292Mod ID: UndeadSuvivor",

        "title": "ClothesBox Redux",
        "description": "Clothes for you and the zombies. - Over 100 items!  Note: This was originally made by modder Mauser_NATO.I later restructured and organized the mod well after Mauser finished his work. However I can not update the original mod anymore. Previously I pushed all my updates to Mauser and he would manually update the mod.This re-release contains all the fixes and progress that I had been sending to him these past several months. However, Mauser, being a citizen in Ukraine is not in a position to make or update mods anymore. Please pray for safety for him and his family.    There will be model clipping and tearing when wearing certain combinations of clothing. Features:   Some jackets have different options. Opened, closed, roll up or unroll sleeves.  Added one simple bag, and one medical shoulder bag.  I made it possible to unbutton some vests.  Added Hunting Webbing vest and army webbing (so far only in the form of clothing with a container)  Made waterproof overalls  Lots of other fun clothing!Known quirks:   There are visual bugs that can happen when wearing certain clothing combinations. No fix to this yet. Supported in these Languages!    Chinese  English  French  German  Italian  Korean  Russian  Spanish -------------------------------- Please check the Patch notes for recent updates!  Common Q&As Q: Is Clothes Box compatible with the the newest Build 42 Patch? (42.02)A: Yes, Clothes Box is fully compatible with the 42.02 update!Q: Can Clothes Box  run on Build 40?A: No, this mod is incompatible with Build 40. Build 41 and now 42 only.Q: Is Clothes Box compatible with [X] mod? A: Possibly. Ask about it in the comment section below.Q: Does this work with Multiplayer???? A: Yes. I was able to host a server with the mod enabled.Q: Does this work or conflict with the old version?A: This re-release works independently than the old one, all item scripts have been redone/renamed for better organization purposes - you can't do this part without having issues. You can stop using the old one since it can't be updated anymore.Q: I am getting visual glitches/bugs when equipping certain clothing items/combinations. Can you fix? A: We are aware of these visual transparent model issues, we can not offer a fix to this in this point of time.Q: When joining a modded server, I get the error \"File doesn't match the one on the server\" How to fix?? A: I wrote up a guide on this, give it a read and try out the methods.  Link[theindiestone.com]--------------------------------Одежда для вас и зомби.Пробую создавать одежду для игры.Так как это мой первый мод, и нету мануалов по моддингу одежды, По этому всё выглядит так как есть.Из интересного:-Некоторые куртки имеют 2 варианта. Расстегнутые и закрытые.-Добавил одну простую сумку, и одну медицинскую сумку на плечо.-Сделал возмложность растёгивать некторые жилеты.-Добавил охотничью и армейскую расгрузку (пока только в виде одежды с контейнером)-Сделал непромокаемый комбинезон ( пока 1вая версия)Для сумок, желетов , и разгрузки я использывал меню из другой одежды, так как ещё не умею создавать новое меню.Некоторые куртки если с ними одеть жилет (кроме бронежилета), начинают некорректно отображатся. Want some fun companion mods? Try These!     There will be model clipping problems, they may be fixed in time. Report them by starting a discussion, don't do it in the comment section, it will get buried. Thank you to CGPlayground for that great graphic dedicated to Mauser!Workshop ID: 2847911733Mod ID: ClothesBoxRedux",
