        "description": "Makes it easy to add moodles for modders.Moodle Framework ConfigurationIf you want colors to be easier to distinguish, you can set to white the reference color for moodles.This applies to both vanilla and modded moodles.You can also deactivate various displays to enhance mod compatibility.Modded Backgrounds with small extensions right or down are now handled too.How to create a new moodleIf you wanna create a Moodle * then follow the next steps, replacing * by your moodle name.1/ Moodle TextureAdd Moodle *.png under media\\ui.Should be 30 by 30 pixels png with alpha enabled.2/ TextureAdd the following text under media\\lua\\shared\\Translate\\ENMoodles_EN {\n    Moodles_*_Good_lvl1 = \"text_1\",\n    Moodles_*_Good_desc_lvl1 = \"text_desc_1\",\n    Moodles_*_Good_lvl2 = \"text_2\",\n    Moodles_*_Good_desc_lvl2 = \"text_desc_2\",\n    Moodles_*_Good_lvl3 = \"text_3\",\n    Moodles_*_Good_desc_lvl3 = \"text_desc_3\",\n    Moodles_*_Good_lvl4 = \"text_4\",\n    Moodles_*_Good_desc_lvl4 = \"text_desc_4\",\n    Moodles_*_Bad_lvl1 = \"text_1\",\n    Moodles_*_Bad_desc_lvl1 = \"text_desc_1\",\n    Moodles_*_Bad_lvl2 = \"text_2\",\n    Moodles_*_Bad_desc_lvl2 = \"text_desc_2\",\n    Moodles_*_Bad_lvl3 = \"text_3\",\n    Moodles_*_Bad_desc_lvl3 = \"text_desc_3\",\n    Moodles_*_Bad_lvl4 = \"text_4\",\n    Moodles_*_Bad_desc_lvl4 = \"text_desc_4\",\n}You can implement only a subset of this as long as you call only the implemented part.3/ Moodle object creationAdd these lines in your mod:require \"MF_ISMoodle\"\nMF.createMoodle(*);4/ Moodle value updatesAccess your moodle from your code withrequire \"MF_ISMoodle\"\nMF.getMoodle(*,playerNum):setValue(myNewMoodleValue)--float0.0 <= myNewMoodleValue <=1.0Missing playerNum will make the mod incompatible with SplitScreen.For tuning options see dedicated discussionLimitationsNot tested with multiplayer. (it is expected to work)Not tested with splitscreen. (it is expected to work since last version)Oscillations are not based on vanilla value and the behaviour may depend on performances.Credits where it is dueThis is inspired from the (removed) mod Zombie Camouflage moodle management by the awesome Dislaik.Known mods using thisMore TraitsAuto SewingProteinsMoodleCannotAttackMoodleSixthSenseExcrementumMoodleCombatSpeedNuclear WinterMoodleSanitySanityMoodleRockyRick's MLC ConcussionGeneral AnxietyMoodleDogEvolving Traits World (ETW)Weather MoodlesSeismic EventsMore SmokesSerious Cigarette WithdrawlMore MoodlesOut of Breath MoodleDirtiness SicknessBCU ModRadiated ZonesSleepy MoodlePregnancyCustomizable Fake InfectionAnomaly RoastingReal KnockoutsMedicine MoodlesHave a look at how they use this mod.Ask for permission[theindiestone.com]This mod can only be added to and extended with the express permission from the original creator. Having received permission, credit must be given to the original creator, both within the files of the mod and wherever the mod roams online.If no permission is received you may not alter the mod.You wanna support? A nice word is always welcome. Constructive feedback too.Workshop ID: 2859296947Mod ID: MoodleFramework",

        "title": "Real Metalworking",
        "description": "This mod addresses the need of vanilla friendly realistic primitive metalworking. It has tons of recipes but it wont let you craft EVERY metal object there is in the game. It is meant to be a profession suitable for a self learned apocalypse survivor or a former blacksmith - not for a superhero who can magically craft complex machinery after reading a magazine.Works in SP and MP and can be added to existing savegames.New items:Stone furnace, bellows, anvil, forging mold, charcoal pit, metal cutter, hand drill and grindstone. + Two recipe books.Recipe details:Most metal items can be melted using a furnace or a blowtorch.The other half can be stomped with any hammer-like object.You can also mine various ores with my : Dynamic Mining mod.Both - melting and stomping- will create unusable metal that is melted into iron ingots.Most car parts and metal furniture can be melted into unusable metal as well (Furnace or blowtorch).All gold/silver can be melted into nuggets and uses along with metal to create welding rods.From iron ingots you can forge tons of tools, materials and even engine parts, using - molds, metal cutters, hand drills, knives, hammers, grindstones etc.Mold is drainable and needs to be refilled with dirt time to time.Charcoal is made in a charcoal pit by slow burning wood for couple of days.All recipes can be created from ground so you can have materials/items nearby and not in your hand. Just in case be sure you keep your other stuff you don't want to be melted further away from the metal works area.Furnace and charcoal pit is built on the spot and cant be moved without destroying it first. Anvil and Grindstone can be moved but are heavy. Destroying a furnace will give you most of the stuff back.Metal antique oven and BBQ can also be craft-forged.Blowtorch uses both petrol and propane.Dismantle railroad tracks, big metal structures and various industrial equipment into metal.Small chance to get hurt(scratched) when doing metalwork.Everything related to metalworking needs a certain skill + a recipe book. Metalworker profession starts with some free recipes already given to them. This is part of... : Project Realistic Overhaul - Set of mods I've created that will overhaul the vanilla game experience to be more hardcore and true to life, but on the other hand leaves you the option to make it through and survive. It makes items and actions have more value and makes the world more alive.Credits :Special thanks to SumYungGuy for testing this mod and to DmitriySenpai for providing the translation template! Thank you.Added Polish translation - Thank you KepaSAdded Spanish translation - Thank you Dr. NitropicAdded Russian translation - Thank you Locked15 and axelroadmanWorkshop ID: 2900671939Mod ID: RealMetalworking",

        "title": "Universal Gun Repair",
        "description": "A mod to add a method of restoring all guns whether from the base game or any mod.OverviewAny gun can be restored using the process of disassembling, cleaning/repairing, and then reassembling.This mod is safe to add mid-game but you will need to visit new locations to find the items added by this mod as loot. If you decide to remove the mod, you should reassemble any gun parts before doing so or they will be lost.Items added by this mod areFirearm Maintenance KitGunsmithing ToolsCleaning SolventPremium Cleaning SolventFirearm LubricantDisassemblyUsing either a Firearm Maintenance Kit or a set of Gunsmithing Tools along with a Screwdriver, break down the gun into partsNote: Any loaded ammo, inserted magazines, or installed gun mods will be removed from the gun before disassemblyThe Disassembled Gun Parts will be named \"{Original Gun's Name} Parts [{Current Condition}/{Max Condition}]\" and will encumber you 20% more than the original gunFrom this point you can Clean, Repair, or Reassemble the gun partsCleaningCleaning requires a Firearm Maintenance Kit, some Cleaning Solvent, and a Ripped SheetAdditionally the gun may need at least a certain amount of Condition remaining to be able to restore Condition through cleaning (by default 5, though this is configurable in the Sandbox options)Cleaning will restore as much Condition as you have Solvent forA normal Cleaning Solvent has 10 uses and will restore 1 point of Condition per use it has remainingA Premium Cleaning Solvent has only one use but will restore all Condition when cleaningRepairingRepairing requires a set of Gunsmithing Tools and Scrap MetalYou may need a certain level of skill in Firearm skills (Aiming or Reloading) before you are able to repair guns (default 6, though this is configurable in the Sandbox options)Additionally the gun may need at least a certain amount of Condition remaining to be able to restore Condition through repairing (by default 0 so even broken guns can be repaired, though this is configurable in the Sandbox options)Each Repair will consume 1 Scrap Metal and restore 1 ConditionReassemblyOnce you are ready to put the gun back together simply use Firearm Maintenance Kit or a set of Gunsmithing Tools along with a Screwdriver and a use of Firearm Lubricant to put the gun parts back togetherSandbox OptionsIn the Sandbox Options you are able to setThe minimum level of Condition on a gun to be able to restore Condition through cleaning (default 5)The minimum level of Condition on a gun to be able to restore Condition through repairing (default 0)The required skill level in Aiming or Reloading to be able to perform repairing (default 6)And adjust the rarity of Firearm Maintenance Kits, Gunsmithing Tools, Cleaning Solvents, and Firearm Lubricants.CompatibilityThis mod should be compatible with all guns added by mods.I've tested it with Brita's and Vanilla Firearms Expansion.Please let me know if you encounter any incompatible guns.Should modders want to allow their items to work as alternative restoration items for Universal Gun RepairItems tagged with UGRToolClean will be able to be used as a tool to clean gunsItems tagged with UGRItemClean will be able to be used as a consumed item to restore 1 Condition per use when cleaning gunsItems tagged with UGRItemCleanFull will be able to be used as a consumed item to restore all Condition per use when cleaning gunsItems tagged with UGRToolRepair will be able to be used as a tool to repair gunsItems tagged with UGRItemAssemble will be able to be used as a consumed item to reassemble gunsSpecial ThanksSpanish translations courtesy of XpaDDerRussian translations courtesy of AvelaviBrazilian Portuguese translations courtesy of gccoiahyItalian translations courtesy of TheSanctuary0Korean translations courtesy of BLUmountainThai translations courtesy of Riko PrushkaCheck out my other mods     Workshop ID: 2899457928Mod ID: 2899457928/UniversalGunRepair",

    {
        "id": "2915430406",
        "url": "https://steamcommunity.com/sharedfiles/filedetails/?id=2915430406",
        "mod_id": "FixTooltipLag",
        "map_folder": "",
        "title": "Fix Inventory Tooltip lag",
        "description": "Fix Inventory Tooltip lagThis mod fixes a performance issue in the game that causes it to freeze up for a period of time, most commonly whenever you rip up clothing.The problem becomes exponentially worse with the more clothing item mods you have, hence why it's the primary culprit.The code is a classic example of \"accidentally quadratic\" If you care about the details, read on. If not, just download it.What the vanilla game does that causes this problemThe game wants to show you a tooltip of the top 10 items that are valid for a given recipe, so it:1. Builds a complete list of all valid items, in no particular order.2. Sorts this complete list to move all items you actually have to the top - O(n) complexity.3. Removes any items that are considered duplicates by virtue of being applicable to different slots (e.g. Left/right handed wristwatch) - O(n^2) complexity!4. Renders the top 10 items of the list, ignoring anything else.This is wasteful because it processes the full list of items, even though we only care about the top 10. What this mod makes it do 1. We build a complete list of valid items, but any items that exist in your inventory are sent to the start of the list, at the point of insertion.2. The list is truncated to the first 10 items and only these are sorted. We store the original length of the list for later - O(1) complexity.3. Deduplication occurs as in vanilla, but, again, the list is now only 10 items long - O(1) complexity.4. We render the list again. If there were more than 10 items, we ensure that the \"and X more\" text is computed correctly from the pre-truncation list size.Workshop ID: 2915430406Mod ID: FixTooltipLag",

        "map_folder": "",
        "title": "Fitness & Workout Overhaul",
        "description": "DescriptionDon't like how the fitness system works ? Too unrealistic ? Too slow ? Too fast ?Updates how much exp is gained based on some realistic inspired parameters.Adds 2 new workout options: a working treadmill and functioning bench-press (bring your own barbell).Lots of customization options to tune it to your liking!Both mods in this pack can be used individually.Works in SP and MP.BenchPress&TreadmillBoth fitness options are integrated into the vanilla fitness system. Meaning they have their own regularity and affect endurance/temperature/sweat/etc. as a vanilla exercise would.Working treadmill which requires power to run. Running will increase fitness, sprinting and strength if you carry more then 50% weightThe Bench-press requires you to find your own barbell, after which you can have yourself a good workout.Regularity shown in right click menu (0-100)FitnessWorkoutOverhaulOverhauls the way fitness experience is calculated. Take the initial perk bonus into account (75% 100% 125%) Get a bonus for the current exercise depending on the regularity Get a bonus depending on the average of all your exercises regularity Get a bonus per perk level Get a bonus when not sulfuring from muscle soreness Get a bonus for spacing out your workouts (promotes regular spaced out sessions)Excel in mod folder to play with / test some values ! Workout With Backpack:backpacks/equipables can remain equiped while doing exercises For treadmill, benchpress AND Vanilla exercisesWorkouts Are Fun:Workout reduces Stress, Anger, Boredom and Unhappiness.(disabled if Dynamic Traits is active)Don't want a passive exp boost outside of doing exercises ? set the passive multiplier to 0 or lower it to your preference.all rates and values can be adjusted or turned off in the sandbox settings.For more detailed info check out the \"FWOFitnessWorkoutOverhaul XP Multiplier Explained\" discussion.Languages (feel free to send in your translations or contact me in the colab section)English FrenchGerman (ZeroFave)Spanish (Dr. Nitropic)Brazilian Portuguese (Kildren)Russian (𝚅𝚒𝚜𝚑𝚗𝚢𝚊)CN & CH (NEP IS LIFE)Korean (정신나간 사람)Known Compatibility  (FWOFitnessWorkoutOverhaul)Exp RecoveryRetroactive Skill BooksSkill Recovery JournalDynamic Traits(negative stat reduction disabled if Dynamic Traits is enabled )Rebalanced Calorie BurningEvolving Traits World (ETW)Standardized Sprinting XP (may be unbalanced)Standardized Passive XP (may be unbalanced)ultimate xp tweakerDucks' No Pain? Yes, Gain!Simple Overhaul: Traits and Occupations  (TBD)More Simple Traits (MST) (TBD)More Traits (Hardy)(TBD)FWOFitnessWorkoutOverhaul sets the XP multiplier for fitness and strength. So any other mod that does this would be impacted. although no other aspects should be hindered. FAQ & Notes  Mod folder contains an excel for calculating the XP multiplier. also see the explanation in the discussion section.Can I add/Remove the mod from an existing (multiplayer) game?-Benchpress/treadmill are safe to remove.-Overhaul will however keep the last set multiplier atm (you can work around this by changing the settings to use a 1x and remove after)Do I need both mods / Can I use 1 without the other ?-Both mods in this pack can be used individually.Do you still need \"Working Treadmill / WorkingBenchPress\" mods ? -No (sorry OG devs but credit to you for the inspiration)Do you still need \"exercise with backpacks\" mod ? -NoHow do i change my sandbox settings in Solo game ?-Try this work-around or modI'm aware the animation are not 100% perfect.I can not fix the sprites clipping in certain angles (without a lot of workarounds which is not high in the prio list might consider is requested a lot).DisclaimerBe a decent human being and ask for permission first.For any conflicts or complaints please contact me first or post in the discussions.Mod info Workshop ID: 2940354599EXP multiplier system:Mod ID: FWOFitnessWorkoutOverhaul       Adds Bench-press & Treadmill functionality:Mod ID: FWOBenchPress&Treadmill",

        "id": "2944004910",
        "url": "https://steamcommunity.com/sharedfiles/filedetails/?id=2944004910",

        "map_folder": "",
        "title": "Woodcutting Skill",
        "description": "What's happening here is not contained...These... things, keep coming endlessly.What, zombies?No, I'm talking about TREES !Woodcutting SkillThis mod adds a Woodcutting skill that makes chopping trees and removing bushes easier and more efficient. At level 0, nothing changes from vanilla. The skill is all upsides.Benefits:(only when chopping trees, obviously)Less endurance used (-7 % per level)Less calories used ( -12% calories modifier every 3 levels)Less chance to lose axe condition (+1 every level)A flat axe tree damage increase (+2 per level) (good for bad axes like the stone axe. Barely noticeable on good axes like the wood axe.)A rare chance of extra items dropping from medium and large trees Makes removing bushes faster and easier (-7% endurance used/level and +10% action speed/level when removing bushes) If you reach Woodcutting level 8, you can no longer get \"Excessive Exertion\" from chopping trees. You will still get \"High Exertion\" but it can't worsen to \"Excessive Exertion\" from chopping trees.Extra items ?The chance of extra items is pretty small, even at high levels they are rare. Logs Tree Branches Twigs Pinecones (for pine trees only) Tree fruits & acorns (rare) (for trees that aren't pine trees, if the [Woodcutting + Foraging] level is high enough (8), AND if it's not winter) Dead squirrels (extremely rare)(if the [Woodcutting + Foraging] level is high enough (8))Note : Nature Abundance buffs/nerfs the chances of extra items accordingly. (-20%, -10%, +10%, +20%)Small trees (size 1 or size 2) never give extra items.The bigger they are......the more xp they give. And the higher the chances of extra items. And when you get extra items, you also get some Woodcutting xp. So yeah, go chop them big trees.Traits?This mod adds a Woodcutter trait that gives +1 Woodcutting for 2 points.Other than that, the following are buffed :Lumberjack occupation: +3 woodcuttingPark Ranger occupation: +2 woodcuttingFarmer occupation: +1 woodcuttingGardener trait : +1 woodcuttingSandbox Settings?There are no sandbox settings for this mod. If many people complain about it I will add some.But for now, there is a file (media/lua/shared/WoodcuttingSkillDefinitions.lua) that you can easily edit to tweak some things.MultiplayerThis has been tested on a local multiplayer server, and it's working. All the code is client side anyway.Tree Kill CountIf you use the mod \"Kill Count\", you have accesss to a Tree kill count and a Bush kill count. (see 3rd image)Skill BooksIf you really need them, someone made a mod that adds Woodcutting Skill Books. But be aware that I have balanced this mod to work without skill books.CompatibilityThis mod overrides the \"Chop Tree\" action and the \"Remove Bush\" action.Fully compatible with \"10 Years Later\", even though it changes some stuff with the Remove Bush action. Props to Dane.Fully compatible with \"Axe overhaul\".Not compatible with \"Chop Tree Bug Fix\". (I don't consider that a bug, the math definitely seems like it's intended by the devs. That being said, the Woodcutting skill is taken into account to reduce the chance of losing axe condition, and I have slightly decreased the chance to lose axe condition even at level 0 anyway.)If you're using the mod \"Kill Count\", you'll get some extra stats (tree kill count and bush kill count)  (see 3rd image)Workshop ID: 2944004910Mod ID: Woodcutting Skill",

        "title": "Entertain Yourself",
        "description": "This mod addresses the need for vanilla friendly entertainment options. It makes some items playable and gives you a small boredom reduce bonus. Works both in SP and MP.Dice can be played visually as it rolls real numbers via actual item and also the character says out loud the number that is being rolled. Needs dice and a paper cup(mugs can be used too) to be played - both can easily be crafted.Playable Flute and Banjo with proper animations, craft system, learning system and real audio songs. You get to know more new songs with practice. There are 4 unique more advanced songs that only someone with 'musical hearing' trait can learn. Audio is from public domain copyright free samples.Cards, Yoyo, Cube and Checkers can be played via crafting menu and they all take different times to complete and give different mood boosts(Each session is further randomized). Yoyo and Cube can be played while walking. Checkers board along with its pieces can be crafted. They make you slightly tired so you wont spam them too much.Crossword and Wordsearch magazines have been converted into famous 90's magazines and give much more boredome/unhapiness reduction + they wont disappear after reading them but rather convert into ordinary magazines that after reading will turn into old magazines. Old Magazines and Newspapers can be studied over and over and over again to gain extra XP - but it drains your fatigue and gives anxiety with every session so the recipe can't be abused. You can gain one type of skill per turn but all the main crafting skills are on the pool so there is a chance to gain any of them. Chances are : 25% to get 25 XP, 25% to get 5 XP and 50% to loose extra happiness on top of the fixed one. Using my Essential Crafting mod you can turn those old magazines into toilet paper or sheets of paper that can be used as fuel and start fires.Your character will say random famous quotes after a study.Find The Holy Bible and start yelling out verses from it. 75 different quotes from the bible will be randomly said out loud and other people see that too. Only works in multiplayer. Bible can be studies as well - giving you 30-30-30 chances or either just getting tired and stressed or just more happiness.Non-Skill Book can be re-read but by-default lowers moddlets a lot less.Hard alcohol can be poured into cups to get more unhappiness reduction from it(1 bottles=4 cups roughly). It is a workaround to disinfecting system that uses happiness points and I cant raise that too high on the bottles(would be cheaty). Drinking from a cup gives you more unhapiness reduction but hunger and calories are divided correctly(Even gives you bit less for balance reasons)Frogs, Small Animals and Zombie corpses can be dissected to gain medical XP. Following amount of XP is given : Frog-20(5 after reaching level 2), SmallAnimal-40(10 after reaching level 3), Zombies-60(15 after reaching level 4). Drains your fatigue and gives anxiety with every session. There is also a small chance you can injure your hands.Cut your own hands or even stab yourself... because... why not?Russian Roulette - 1/6 chance of actually killing yourself - if not then you gain Aiming and Loading XP and wont loose the ammo.It is suggested to use general XP gain modifiers on your sandbox/server options and/or my following mods Slower Actions  and Slower Reading along with this one. PLANNED. : Playable Drums and Harmonica with proper animations, craft system, learning system and real audio songs. This is part of... : Project Realistic Overhaul - Set of mods I've created that will overhaul the vanilla game experience to be more hardcore and true to life, but on the other hand leaves you the option to make it through and survive. It makes items and actions have more value and makes the world more alive.Credits :BIGGEST THANKS TO Glytch3r  for the amazing animations!!!From your poker script I was able to make the random bible quotes addon - Thank you VoldarBrazilian Portuguese         "description": "I'll update when B42 stable version is released. While sneaking, crouching animations will be played instead of sneaking animations.In other words, replaces sneaking animations with crouching animations.Includes crouched idle, walking, running, turning and SHOOTING.This mod will very slightly reduce your movement speed while sneaking. This is vanilla behavior.Has a sub mod named \"True Crouching - Shooting Only\".This will enable only the crouched shooting animations. It won't change sneaking animations.Enable only ONE of the mods. Why this mod? I don't like the way the character looks while sneaking. I always wanted the sneak key to function as a crouch key so I could roleplay(?).For example, now I can stand on the edge of a roof, crouch, and plan my next move in a realistic looking way. How does it work? Does not add/replace actual animation files, mostly. I added animations only for crouched shooting.There are two base sneaking stances in the game: Sneak and LowSneak. LowSneak is the crouching animation we all know from every other game.Normally, this animation is played only when the character is sneaking next to a wall.I just changed a few lines in some files so that the game plays animations of LowSneak instead of Sneak whether the character is next to a wall or not. To do (maybe...) Prevent crouching while fractured(and/or burnt?) (the game allows LowSneak while fractured/burnt in vanilla) Add buff to hit chance when crouched Swapping weapons while crouched and aiming a weapon shouldn't transitions to standing Block aim ready stance while crouch aiming with melee if there are no zombies in range so the char doesn't stand up Notes  Conflicts with:  Arsenal GunFighter (Compatibility addon here) Real Full Auto (Weapons will use their default fire rate while shooting crouched) Katana Stance (Character will not crouch when idle while holding a katana) Braven's Nail Guns (Nailguns' fire rate will be reduced while shooting crouched)  Safe to add/remove mid-save. Works in multiplayer. Feedback/Suggestions are welcome. Recommended mods  True Crawl  - Adds a prone stance to the game!                     You can crawl everywhere and shoot while prone.Check out my other mods                                                [www.buymeacoffee.com]My third mod. Learned a little PZ animation.It took a few hours to figure out how to do it. Then I implemented crouched shooting which really wore me out :/                                                       Workshop ID: 2966176354Mod ID: TrueCrouchingMod ID: TrueCrouchingSO",

        "title": "Working Seatbelt",
        "description": "DescriptionStay safe in the apocalypse, either by fastening your seatbelt, or relying on your airbag, and reduce the damage taken from car crashes, as you navigate the infected streets of Kentucky!Important NoteThe vehicle damage system in Project Zomboid operates randomly, meaning that even with identical conditions (such as player health, speed, and type of car), two crashes can result in different levels of damage. In one instance, you might end up with 75% health and no serious injuries, while in another, you could have only 20% health and several deep wounds. It's important to know that this mod can't help with crashes that are bad enough to lead to death, due to limitations in the game's scripts. At the current moment, the mod will only reduce damage and fractures resulted in a car crash. For other wounds (Cuts/scratches/etc), they'll be added in later updatesCompatibility Other Mods   Compatible with Proper Vehicle Injuries for MP  Compatible with Real Knockouts  Compatible with vehicle mods  Game Version - Tested and works on 41.78.16+. Not tested on earlier versions Multiplayer - Functional in multiplayer Pre-existing saves - Can be added to your pre-existing save, though sandbox settings will be set at default values, which may not be ideal for everyoneTo-doThe following feature(s) are planned to be added in the future for this mod Reduce other wounds (Bleeding/Scratches/etc) from car crashesKnown Bugs/Issues None at the momentTranslationsThe mod is currently available in English and multiple other languages, which can be seen at the credits section.If you'd like to translate this mod to your local language, feel free to do so, upload the translation, and comment out the link so it can be added.Not sure where to start? Check out this guideLinks[discord.gg] - Join me on Discord[ko-fi.com] - I love Coffee. Perhaps you'll consider buying me one?FeedbackWhether it is a suggestion, feedback, or something else you've got on mind, it'd be         "title": "Plumb Helper PLUS",
        "description": "About B42: I have a working version for B42 here.  As far as I can tell, the new rain collectors haven't been fully integrated into the build yet, unfortunately. The mod seems to work just fine, but doesn't detect water sources other than the city water, which would explain why plumbing doesn't work at the moment (confirmed with multiple reports).I've made some changes to the mod, and I'll be bringing them to 41 after I translate them. STAY TUNED! Check out the infomercials! Plumb Helper Plumb Helper PLUS A SIMPLE TOOL FOR  A SIMPLE JOB! With a pipe wrench in your inventory, an option will appear in your context menu. The first option will activate a cursor that shows where water sources are and whether or not the tile is considered \"Indoors\" (the two requirements for plumbing sinks).If the Kentucky Water Supply is still active and your Find Rain Collectors cursor is on a sink that can be plumbed to it, a new icon of a city with a water drop will appear.BUT WAIT, THERE'S MORE!Now there's a SECOND OPTION! Select it to activate a cursor to find your faucets one floor below! No more running up and down stairs trying to figure out where that sink is!Sink to new levels with Plumb Helper Plus!Tooltips:^The Find Rain Collectors tooltip will show whether you're currently indoors (only checks when you open the context menu- does not update in real-time to preserve performance)and whether the KY Water Supply is active (sandbox option to disable if you find it unimmersive) Frequently Asked Questions: Does it work in multiplayer?   Indeed it does!Does it work with a controller?   You know it!I found a bug/ran into a problem, what should I do?  Report it here!What's new?  Check out the changelog!Can I put this in my server's modpack?   Sure! (Credit and links appreciated)Are there any known incompatibilities?   Not that I'm aware of. Tested with over 350 mods both online and in solo! Is it safe to add or remove mid-save?   Yes! The option to show the KY Water Supply status is enabled by default, but can be changed at any time using a mod like  Change Sandbox Options (by Star) The Texture looks bad, what gives?   If you want cleaner textures, you'll need to disable \"Texture Compression\" in the Display settings (this also removes the problem of the floor having a visible grid at different zoom levels). This may come at a performance cost, unfortunately. Translations: Since there were very few lines, I went ahead and translated it into every language PZ is available in. This was done using Google and DeepL, so the results may not be great, but it should be usable. Any improvements are welcome and appreciated. Thank you to juni2335 for reminding me about encoding and fixing the Korean translation!Thank you to Inferno for fixing the Spanish translation!Thank you to toomanynights for fixing the Russian translation! Check out his excellent QOL mod Dig Worms!Thanks for stopping by, and stay tuned for more mods!Don't forget to rate! It helps the mod more than you'd think!Tips are never expected but always accepted!  [paypal.me]Workshop ID: 3146046428Mod ID: PlumbHelp",

        "description": "Since other skills allow using up resources to train said skill, i thought to add the same functionality to carpentry.FeaturesTrain carpentry using planks and scrap wood as materials.You need a saw, and either a hammer or screwdriver as tools.Has a random chance of keeping materials after, and its increased by your carpentry level.On failure, planks get downgraded to scrap wood, and scrap wood is destroyedIn any case you gain XP, random to a degree, and modified by your carpentry level too.If more materials are present, training will continue in a loop, similar to the \"Auto\" series of modsFuture plansBalance, i dont want this to be OP and a substitute for the regular disassembly loop, but an addition.That said, if you have balance notes, i will consider them.Add Nails/Screws as secondary materials, necessary if you want to use the hammer or screwdriver.Add bonus XP the more tools the player has. Having only the saw will yield the least etc.Add less XP for working with scrap woodNot multiplayer compatibility tested but if it isn't, it will be :)Better UIMy Other ModsIt's NOT Fine - Turn the oven on and off automatically, and a few other oven QoL tweakshttps://steamcommunity.com/sharedfiles/filedetails/?id=3161578967Spawn on Coordinates - Spawn anywhere on the map using x, y & z coordinates!https://steamcommunity.com/sharedfiles/filedetails/?id=3165835650Workshop ID: 3170803277Mod ID: TrainCarp",

    {
        "id": "3197857648",
        "url": "https://steamcommunity.com/sharedfiles/filedetails/?id=3197857648",
        "mod_id": "P4Decoholic",
        "map_folder": "",
        "title": "Decoholic",
        "description": "Overview :There may be multiple patterns of furniture overlay graphics, but the patterns are defined per coordinate, not per item. Therefore, when you bring furniture back to your base and place it there, you may see a different graphic than the first time you picked it up. This mod solves that problem and allows free selection of overlay graphics for furniture. And for world-placed items other than Moveable, the placement position can be adjusted.Confirmed to work with Build 41/42.Features - 1.Change Furniture Display :You can change the overlay graphic freely by following the steps below.(1) Execute \"Change furniture display\" from the item or world context menu.(2) You can select the graphics to display from the configuration window.Press the \"Select\" button below the graphic you want to display.The currently selected graphic will be marked with a red circle icon in the upper right corner.\"Default\" will return to the original display mode. In this setting, the graphics displayed will change depending on the coordinates of the placement.Features - 2.Adjust Item Position :You can adjust the placed item position by following the steps below.(1) Execute \"Adjust item position\" from the world item context menu.(2) You can change the item positions and rotations from the adjust position window.\"--\" button : Decrease value a lot.\"-\" button : Decrease value a little.\"C\" button : Clear value to zero.\"+\" button : Increase value a little.\"++\" button : Increase value a lot.Options :These options are available in Sandbox Options.Meta > Enable Adjust Item Position : Enables Adjust Item Position. This option is intended for cases where you want to limit this features to users in MP.Q&A :Which furniture can I select graphics?This includes container-type furniture such as shelves and furniture with overlay graphics such as chairs covered with sheets.Can furniture from other mods be made to work?It's possible, although it needs to be handled individually. Please request the mod name.How do I do a piece of large furniture that has been divided?You can select graphics in each divided part.What happens if I rotate the furniture?If the furniture is rotated, it will be processed as a different item. Therefore, please select the graphics for each direction. However, if the same direction is made again, the previous selection is kept.Already I have been selected, but before I know it, it's back to the default display..?It may have reverted to the default display for an unknown reason. Try moving items in and out or re-placing furniture.Supported Mods :This mod supports overlay images added by the following mods.Functional ClotheslineMy So-Called SnackPinevillePump PuryTile FixesKnown Issues :If the overlay graphic of the oven has been changed, there is a problem with the overlay graphics disappearing when the device is turned on or off. In this case, the graphics will not be restored unless it is manually changed again.The menu of sinks does not appear in the world context menu. However, this is due to the vanilla implementation and cannot be resolved at this time. If you wish to change the display of a sink, please pick it up once and then execute the change process from the item context menu.If an item is removed from a square that contains an item whose height (Z) has been changed by the Item Adjust Position feature, the height of other items in the same square will be restored. This is a vanilla specification, but I'm considering how to handle this on the mod side.Future plans :Bug fix (if it exists)Remarks :This mod requires that \"DISPLAY > Textures > Double-sized Textures\" in GAME OPTIONS is ON. If this option is OFF, the correct size will not be displayed. I don't plan to support this option now, but I will consider it if there are enough requests.Release Notes :v1.13 - Compatible with Build 42.v1.12 - Added Sandbox Options.v1.11 - Added ContextSubMenu, Added translation (RU), Supported Pineville Mod.v1.10 - Supported Functional Clothesline Mod.v1.9 - Supported Tile Fixes Mod.Please refer to \"Change Notes\" for the older history.If you enjoy this mod and would like to support its development, you can do so through the services below. Your support helps keep me motivated and allows me to continue improving and updating the mod. All contributions will be used for development purposes, such as AI service subscriptions. \n\n[buymeacoffee.com]\n[ko-fi.com]\nWorkshop ID: 3197857648Mod ID: P4Decoholic",

        "title": "[B41] [SP/MP] Doggy's Hunting Mod",
        "description": "Originally posted by SirDoggyJvla:The mod will not receive further work due to B42 being out. Mod works for singleplayer and multiplayer.Thanks for playing the mod.A complete new take on hunting for B41. Find traces of animals while foraging and hunt them. Multiple factors can impact your chance of hunting the target such as daylight, wind or the fog, as well as your gun caliber, your traits or the animal type.Features: Forage for animal tracks Deleted requirement to use the crafting menu ! Any weapon can be used to hunt based on some criteria Adapt your weapon to the target, a shotgun will be better suited to hunt birds while a rifle would be used for bigger targets. Using a caliber too powerful can shred the target and leave less meat Some melee weapons can be used but the more agile is the target, the less effective the weapon will be (you wouldn't use a sledgehammer to hunt right ?). Spears tend to be the best at this job Butcher deers and pigs corpses for chunks of meat and leather. Also get bones when Food Preservation Plus is installed Years Later mode in the sandbox options to make deers, pigs and rabbits spawn in areas with human activity Sandbox options to tweak anything, you can deactivate a few parameters by setting their impact to 0%Compatibility:Can be added mid save safely !Ammo calibers are used to define the ability for a gun to hunt. A list of ammunitions in vanilla game and mods is used for compatibility but some might be missing. This system bases itself on the energy and the diameter of bullets but it will be flawed, mostly because it won't actually consider the weapon's caracteristics.THE MOD IS COMPATIBLE WITH ANY FIREARM MOD.BUT Arsenal 26 seems to break knives (vanilla ones at least) and these might not be recognized by the mod. I can't do anything about it, it's their fault for removing a vital tag on items \"SharpKnife\" which is used to recognize knives used in butchering, even vanilla butchering crafts (maybe they patch those ?).And if you use a gun which has a caliber not recognized, it should tell it in the tooltip of the hunting context menu option. Report it with the mod name and the ammunition name in the description of my mod.The bow and arrow mod will possibly not be made compatible, due to it having a weird system. I'll see what I can do.Disclaimer:No animals are actually visible, it is just an illusion ! While it is technically doable, I will not bother doing such a detailed system due to the near release of B42.The mod might need some balancing on some aspects. Don't hesitate to give some feedback on it, I did some testing to see how rare the animal tracks would be, but I did not test enough the hunting system if it is fair or not. You can tweak almost every values so don't hesitate to.    Native compatibility with Food Preservation Plus ! Butchering deers and pigs will drop bones. Check out Project Overgrown other mods !    Play against The Last of Us Infected and try to survive a low population scenario against hardcore zombies !     Use the guns of The Last of Us thanks to The Last of Guns Remastered !     Test yourself or your friends for infections thanks to the Infection Scanner ! [discord.gg][discord.gg]Workshop ID: 3351307837Mod ID: DoggyHuntingMod",

        "description": "Works with existing saves for singleplayer and multiplayer.What's the purpose?You've just finished a big haul, you're back at your base and now you have to unload everything.  Wouldn't you want to be able to select everything and ask the game to filter for you?Well now you can!  All you have to do is set which category your containers accepts and you're set.How to useRight click any container and select \"Configure Container\".  This will bring up the list of item categories based on the items present in that save.It works the same asLeft click to set one category.Ctrl + Left click to add/remove a single category.Shift + Left click to bulk add/remove categories from the previous click to the current click.After you've set the item categories you want this container to receive, here are the two ways to transfer.Selecting multiple items in your inventory, right clicking and selecting transfer to assigned containers.Shift + transferAll for your selected inventory.Helpful TipIf want to prevent item(s) from being transferred, mark them as favorite and they will stay in your inventory.CompatibilityThis works with any mods that recategorize items (In fact it's better with!).  Including Better Sorting or any other mod that recategorize itemsGamepad SupportGamepad support is barebone but functional (best of my knowledge)To manage the specific container, make sure it is highlighted.  You can toggle the inventory in order to cycle nearby containers.To Transfer All applicable Items, select the option Transfer All + Right Trigger[Ko-fi.com]Workshop ID: 2650547917Mod ID: manageContainers",

        "id": "2866258937",

        "title": "[B41/B42] Mini Health Panel",
        "description": "A minimalistic wounds display without the need to open the health panel. Can be disappeared when no wound need to be treated.Updated for Build 42The add-on has been updated for Build 42 while a separate version for Build 41 remains untouched and fully compatible, thanks to a new files structure system where each version of the mod is only visible by its respective game build, ensuring seamless functionality for players on both versions.Only for B42, It now includes a new muscle strain indicator for each body part. The indicator evolves by becoming less transparent and changes color from orange to red as muscle strain worsens.If auto-hide is enabled, the silhouette is revealed with a brief blinking effect when a strain threshold is reached.This feature can be toggled off if not needed.What does it do?It give a permanent overview of your character's wounds on a minimalistic display. The body silhouette disappear when there are nothing to treat and appear when there is a wound.When a body part is flashing red, there is a wound that needs to be treated.When it's white, the wound is either bandaged or splinted.When it's orange, the bandage is dirty and needs to be replaced.If the wound is bandaged but it's still flashing that means you didn't fully treated the wound (glass still lodged, deep wound needs to be stitched, etc...)How to use it?Right clicking on the component will bring a contextual menu with all wounds and the settings of the addon.Left clicking just brings up the classic health panel of the base game.You also can drag it around and place it where you desire.Optional modMod Options is optional and adds an option to disable my mod (mainly for public servers)CompatibilityThis mod should work with any other mod (no incompatibility has been reported so far)This mod works in single and multi-player.This mod doesn't work in split-screen and won't be.Known issueSeveral reports about bandage not properly working, which I couldn't replicate myself. This sounds like a conflict with another addon which I still don't know which one. This should be now fixed.The panel may look small or big depending of your game resolution, this is unfortunately a common problem for most of interface add-ons.B42 may have fixed GUI scaling, I will look if scaling my panel still makes the silhouettes ugly or not.Support meIf you really like my mod you can support me through Ko-fi[ko-fi.com]Workshop ID: 2866258937Mod ID: MiniHealthPanelMod ID: MiniHealthPanel",

        "title": "Easy Drop'n'Loot",
        "description": "BUILD 42 is now supported!Drop and loot items of the same category effortlessly!Tired of sorting items manually? This mod automatically transfers all items of the same category into an open inventory, saving you time and effort.It strikes a balance between manual sorting and full automation. You still choose which inventory (e.g., Duffel Bag) and which container (e.g., Crate) to use.Features Transfer Category - items from player's inventory are transferred into a container only if the container already has items of the same type Loot Category - items from loot inventory are transferred into a player's inventory only if the player's inventory already got items of the same type Drop (category) - transfers items of the same category as a selected item (or multiple categories if multiple items selected) between player's inventory and loot inventory Grab (category) - transfers items of the same category as a selected item (or multiple categories if multiple items selected) between loot and player's inventory Favorite and Equipped items are ignored Now supports keybindings Transfer Category and Loot Category buttons can be hidden from the UIHow to use Click \"Transfer Category\" button to transfer items from player's inventory to loot inventory Click \"Loot Category\" button to transfer items from loot inventory to player inventory Right-click any item and select \"Drop all (category)\" to transfer items from player's inventory to loot inventory Right-click any item and select \"Grab all (category)\" to transfer items from loot inventory to player inventoryExamplesTransfer Category If you have \"Food\" items in your Refrigerator you'll only be able to transfer \"Food\" from your Duffel Bag If you have \"Skill Books\"  and \"Literature\" items on your Shelves you'll only be able to transfer \"Skill Books\" and \"Literature\" from your Duffel BagLoot Category If you have \"Food\" items in your Duffel Bag you'll only be able to loot \"Food\" from Refrigerator If you have \"Skill Books\"  and \"Literature\" items in your Duffel Bag you'll only be able to loot \"Skill Books\" and \"Literature\" from ShelvesGrab (category) If you select \"Food\" and \"Clothing\" items from currently selected container - all items of type \"Food\" and \"Clothing\" will be transferred into player's inventoryDrop (category) If you select \"Food\" and \"Clothing\" items from your inventory - all items of type \"Food\" and \"Clothing\" will be transferred into currently selected containerQ&AQ: It's not doing anything when I click \"Transfer all\" or \"Loot all\"A: Make sure there's a match between your inventory and loot inventory, e.g., you're trying to Loot Refrigerator into your Duffel Bag which doesn't have any Food itemsQ: Works in MP?A: YesQ: Safe to add/remove to an existing game?A: YesCompatibilityAutoLootSmart StackBetter SortingSearch ContainersSchiZ's Random PatchesSpiffUI - InventoryLanguage support English Russian (Русский) Traditional Chinese (繁體中文) (by Minidoracat) Simplified Chinese (简体中文) (by Minidoracat) Spanish (Español) (by Dartaroth) Italian (Italiano) (by Viper79) Ukrainian (Українська) (by Cosmo) Brazilian Portuguese (Português Brasileiro) (by Nociam) Portuguese (Português) Korean (한국어) (by Hx)For mod developers ISInventoryPage.EDNLLootItems - \"Loot Category\" inventory button ISInventoryPage.EDNLDropItems - \"Drop Category\" inventory buttonSpecial thanks ꧁༒☬ GΞX ☬༒꧂ Js Segaside dhert Charles_ya (KR) Диcтoрий Rusty #DopeRustSource: https://github.com/SharePickle/easy-drop-n-lootWorkshop ID: 2871469707Mod ID: KADropnLoot",

        "id": "2948824747",

        "map_folder": "",
        "title": "Inspect Weapon",
        "description": "About Tired of scrolling to your equipped section of the inventory to check your weapon's status and attachments?This mod allows you to inspect your currently equipped weapon on your primary hand at anytime, by:- Hold down the reload button and choose \"Inspect Weapon\"- Right click on any weapon in your inventory or a world container and choose \"Inspect Weapon\"  will automatically try to equip it in your primary hand slot and inspect it- Pressing ; button to inspect current weapon. You can rebind this button through PZ's default option menuThis mod comes with a simple UI and a terrible animation that took an hour to make :) Stats & Navigating UI Unlike the exact stats that are shown within the weapon's tooltip, the \"condition\" and \"number of repair\" stat are shown in estimation text (yes, I took this out of the DayZ book). I personally think that this will give players a better immersion on how their characters physically see the condition of the weapon, rather than numbers on a datasheet. Condition - Pristine: This weapon has a perfect 100% condition, and on top of that, it was never repaired- Used: This weapon has a condition between 50%, all the way to 100%. Weapons that are 100% but were repaired even once will get knocked down from \"Pristine\", to this category- Damaged: This weapon has a condition between 30% to 50%- Badly Damaged: This weapon has its condition less than 30% Number of repair - No sign of repair: Pretty self-explanatory, this weapon hasn't been repaired even once- Slightly repaired: This weapon has been repaired, but less than 3 times- Heavily repaired: This weapon has been repaired at least 3 timesIt is sort of hard to determine what's the good number for \"Number of repair\" stat. Realistically, I think 3 times duct taping or replacing some parts of a firearm would look noticeable enough to be deemed \"Heavily repaired\" Repair If weapon is damaged, an \"information\" button will be shown next to \"Number of repair\" stat. You can press on it and directly fix your weapon from the pop-up context menu, just like how you usually do it within the inventory pane Attachments This section is only shown for ranged weapon. I am not too sure if the melee weapons can use attachments (or any mods out there that allows it), prove me wrong :)Attachments can be equipped by clicking on a blank attachment slot, and a list should show options for compatible attachments for that slot. To un-equip it, double clicking on a currently equipped slot.For \"Magazine\" slot specifically, ammo will be shown for each one, and you can choose to load or unload them by right clicking on them. For controller You can navigate the UI using D-Pad buttons, with A (South) Button as accept, B (East) Button as Back/Close, and X (West) Button as Context/Sub menuAlso please be advised, I am aware of the issue that the radial menu entry not showing. This has to do with other gun mods overwriting all the radial menu entries. For VFE specifically, I am working with the devs to figure out a solution to that. To-do list  High priority - Repair weapon- Indication for screwdriver in inventory- Potential fits into attachment slot- Magazine display (if applicable)- Working with multiplayer- Custom keybind to inspect current weapon- Window position save Low priority - Controller support for all my Steam Deck homies out there- Splitscreen coop support- Add ability to move window for controller- Skill check to enable potential fits into attachment slot Frequently asked questions  Is this compatible with VFE? - Some adjustments to the mod has been made for VFE for attachments of several firearms to show up. There might be other undiscovered issues, so if you have found any, let me know how to recreate it. Is this compatible with other weapon mods? - So far several of them were confirmed to be working, but some might have some issues, if they introduce new mechanics to how vanilla weapon should work. I can't test it all myself, so do try it for yourself. My goal for this mod is to keep it as compatible with the vanilla as possible, so any changes in the future by IndieStone wouldn't affect it too much. Why don't those melee weapons have inspect animation? - I actually do not know how to make the animation for this to look interesting enough...? I'm open for suggestion on this one. Does it work with B42? - Currently, yes! Feedback This is my first ever published mod. It took about a week of work to make. Any feedback from the end-user experience, to code improvement is appreciated. Credits Massive thanks to:- Vilespring for helping with VFE integration- Booker_D_Fred for code review/suggestions- Jarl44 for potential attachment feature suggestion- Mr.Shersh for reminding me to add disclaimer about having attachment in main inventory- BryanComY, NopOYes for Brazilian Portuguese translation-  Inferno   Dydimos  for Spanish translation-  Riko Prushka  for Thai translation- Booker_D_Fred for Russian translation- HugoTLS for French translation- secdet for Ukrainian translation- Nozownik for Polish translation- Dunganga for Turkish translation- 76561198177186117 for Traditional Chinese translation- Gladicek for Czech translation- KimLeon for Korean translation- Eternity, Art Tippet for Italian translation- Lampiooo for German translationLike the mod? Buy me a coffee if you can :)[buymeacoffee.com]Workshop ID: 2948824747Mod ID: RiskyInspectWeapon",

        "description": "Getting hypothermia in vanilla will slowly start to drain your health - it can drop to very low levels but won't kill you.  I give you two options to change that :Main Version - gives that final touch at the end to kill you. It is randomised so it may take 10 minutes to several hours(in-game time). It only becomes dangerous when you already have the health drained previously by the vanilla hypothermia system.  This is still quite hard to accomplish in my opinion. You'd really have to be in the cold for long time without any chances of fire or getting inside somewhere.Hard Version - starts to randomly drain health every 10 in-game minutes if you have the Freezing/Hypothermia moodlet AND ONLY if your general health is already below 15. This ensures coming out of the cold won't be as quick, as you have to get past the freezing phase as well. If you get your temperature up to 'Cold' then you are clear and even if below 15 health you won't get any extra health drain. It also adds another dimension to it if you were to have somewhat very poor health already. I personally suggest this version.IMPORTANT: The preview video is for show only - to let you know it can be done. The actual process can't be demonstrated with a short clip as the vanilla ColdDamageStage mechanic ticks in real time and fast forwarding in Debug would give wrong results. Time scale is similar tho. This is part of... : Project Realistic Overhaul - Set of mods I've created that will overhaul the vanilla game experience to be more hardcore and true to life, but on the other hand leaves you the option to make it through and survive. It makes items and actions have more value and makes the world more alive.Workshop ID: 2955282161Mod ID: HypothermiaKillsMod ID: HypothermiaKillsHard",

        "title": "Rain Wash",
        "description": "Rain washes blood and dirt away. Including the character's body, clothing, equipped bags, equipped and attached weapons, the vehicle your character is in and vehicle attached to it or last used vehicle and vehicle attached to it.How it worksBody, clothing, bags, weaponsWhen it's raining and your character is outside (and not in a car, of course) the mentioned things will slowly be cleaned. The process begins as soon as a body part* or item becomes wet: some of its blood is turned into dirt, then the dirt is washed away.Not everything is cleaned at the same time! Notice how wetness is increased: top layer of clothing / uncovered body parts -> inner layer of clothing -> covered body parts. It's a vanilla mechanic.How fast an item or body will be cleaned depends on rain intensity and the item's or body's wetness. Not all dirt will be washed off clothes! Depending on the water resistance of the clothing, up to 20% of dirt will remain. Not all dirt will be washed off your character! Up to 10% of dirt will remain.VehiclesThe vehicle your character is in and the vehicle attached to it will be cleaned.The last used vehicle and the vehicle attached to it will be cleaned after your character leaves it too. This works as long as your character is within approximately 100 squares of these vehicles. After reloading the save you need to enter/exit again for this to work.Wash In The RainWhen your character is outside and it's raining right click and you'll see the \"Wash In The Rain\" option. Works like \"Wash Yourself\" but slower and your character will take off all clothes (and put them on after finishing).OptionsIf you want to configure the mod, you need to install and enable the Mod Options mod.Go to Options -> Mods -> Rain Wash.CompatibilityGame version: Build 41.56+ (MP supported)This mod is compatible with:- any mods that add clothing, bags and weapons;- any mods that add/change character traits;- any mods that add vehicles.Developing mods takes a lot of my free time and I would appreciate it if you could give me more motivation to create quality content by supporting me:[www.patreon.com][ko-fi.com][discord.gg]My other mods:       ⚠️ You can find the information about my mod updates and how to fix the \"Workshop item version is different than the server's\" error in my Discord: https://discord.gg/3wxUddhBs4⛔ PermissionsRedistribution of this mod without explicit permission from the original creator is prohibited under any circumstances. This includes, but not limited to, uploading this mod to the Steam Workshop or any other site, distribution as part of another mod or modpack, distribution of modified versions.© 2022 NoctisFalcoWorkshop ID: 2657661246Mod ID: RainWash",

        "description": "How does it work?The SafehousePlus is a modification that revolutionizes the safehouse system in the game, offering a completely new experience with innovative features. With an intuitive and modernized design, players can manage multiple safehouses simultaneously without needing to travel to them to add friends — they don’t even need to be online. Additionally, it’s possible to view the safehouse boundaries in real-time, preventing constructions outside the protected area.This mod is essential for servers where administrators seek greater control over the locations players can use as bases. In the sandbox options, there are various customizable rules to configure and manage safehouses, such as: Allowing or preventing players from being part of more than one safehouse; Setting how many safehouses each player can own; Creating a VIP player list, who can have more (or fewer) safehouses than others; Establishing size limits for safehouses, such as width, depth, and number of floors; Restricting types of rooms that prevent a building from being claimed as a safehouse. For example, it’s possible to block the claiming of buildings that have a bar, something that would be allowed in the original game.In addition to these features, SafehousePlus fixes some bugs present in the original game’s safehouse system, such as: The possibility of claiming a safehouse and transferring it to another player who already has one, allowing them to accumulate multiple safehouses and potentially dominate an entire city; Fixing buildings that appear on the map with colors different from orange (the default for safehouses) but are still claimable.IncompatibilitiesThe SafehousePlus was specifically developed for version 41.78.16 of the game and, for now, is not compatible with higher versions. Additionally, any mod that relies on client-side interface or safehouse system resources will be incompatible with this mod, as 100% of the original code has been rewritten from scratch on the client side.The SafehousePlus also modifies the client panel, specifically the \"CLIENT\" button located in the top-left corner of the screen. Therefore, most mods that use or alter this interface will not work correctly with this mod.You can check out some incompatible mods here: Incompatible ModsAuthor's NotesThis mod was created with great care and dedication for our Última Esperança[discord.gg] community — a special thanks to everyone for their incredible support! I believe it can be useful for many other communities as well, which is why I decided to make it public and available to the entire Project Zomboid community.If you enjoyed the mod and would like to support my work, feel free to contact me to learn more about how to contribute. Your help is essential for me to continue developing new ideas and improvements for the game!Feedback and suggestions are always welcome. Don’t forget to share your thoughts, rate the mod, and leave comments — they are crucial for me to further enhance this experience![theindiestone.com] This mod can only be added to and extended with the express permission of the original creator. After receiving permission, credit must be given to the original creator, both in the mod files and anywhere the mod is made available online. [ko-fi.com]Workshop ID: 3419955629Mod ID: SafehousePlus",

        computed: {
            allTags() {
                const tags = new Set();
                this.mods.forEach(mod => mod.tags.length ? mod.tags.forEach(tag => tags.add(tag)) : tags.add("Other"));
                return Array.from(tags);
            },
            filteredMods() {
                let mods = this.mods;
                if (this.selectedTag) {
                    mods = this.selectedTag === "Other"
                        ? mods.filter(mod => mod.tags.length === 0)
                        : mods.filter(mod => mod.tags.includes(this.selectedTag));
                }
                if (this.searchQuery) {
                    const q = this.searchQuery.trim().toLowerCase();
                    mods = mods.filter(mod =>
                        mod.id.toLowerCase().includes(q) ||
                        (mod.mod_id && mod.mod_id.toLowerCase().includes(q)) ||
                        (mod.title && mod.title.toLowerCase().includes(q))
                    );
                }
                return mods;
            },
            missingMods() {
                if (!this.selectedTag) return [];
                return this.selectedTag === "Other"
                    ? this.mods.filter(mod => mod.tags.length > 0)
                    : this.mods.filter(mod => !mod.tags.includes(this.selectedTag));
            },

                return "Mods=" + this.mods.map(m => m.mod_id).join(";");
